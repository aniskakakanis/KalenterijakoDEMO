<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yhteisikkuna — Omat projektit</title>
<style>
  body { font-family: -apple-system, Segoe UI, Inter, sans-serif; background: #EDF0F3; color: #161B22; max-width: 680px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  h3 { font-size: 14px; margin: 26px 0 10px; }
  button { background: #2A4B7C; color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-bottom: 20px; }
  button:hover { background: #1D3559; }
  button.secondary { background: #fff; color: #2A4B7C; border: 1px solid #2A4B7C; }
  a.back { font-size: 13px; color: #2A4B7C; text-decoration: none; }
  a.newproj-link { display: inline-block; background: #2A4B7C; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 14px; text-decoration: none; margin-bottom: 10px; }
  .card { background: #fff; border: 1px solid #DBDFE5; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; text-decoration: none; display: block; color: inherit; position: relative; }
  .card:hover { border-color: #2A4B7C; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .meta { color: #8A93A3; font-size: 12px; margin-top: 4px; }
  .involved-badge { position: absolute; top: 12px; right: 14px; background: #DCF3E4; color: #1E6B3C; font-size: 10.5px; padding: 2px 9px; border-radius: 999px; }
  #empty { color: #586174; font-size: 14px; }
  .empty-note { color: #8A93A3; font-size: 13.5px; margin-bottom: 10px; }
  #adminLinkWrap { margin-bottom: 10px; }
</style>
</head>
<body>
<div style="float:right; display:flex; align-items:center; gap:8px; position:relative;">
  <button class="secondary" id="myProfileBtn" onclick="toggleMyProfilePanel()">Ladataan…</button>
  <button class="secondary" onclick="logout()">Kirjaudu ulos</button>
  <div id="myProfilePanel" style="display:none; position:absolute; top:44px; right:0; width:260px; background:#fff; border:1px solid #DBDFE5; border-radius:10px; padding:16px; box-shadow:0 4px 16px rgba(0,0,0,0.08); z-index:5; text-align:left;">
    <div style="font-weight:600; font-size:14px;" id="panelName"></div>
    <div style="color:#586174; font-size:12.5px; margin-top:2px;" id="panelEmail"></div>
    <div style="color:#586174; font-size:12.5px; margin-top:2px;" id="panelOrg"></div>
    <div style="display:inline-block; margin-top:8px; padding:3px 10px; border-radius:999px; font-size:11px; background:#E1E6EF; color:#2A4B7C;" id="panelRole"></div>
    <div style="margin-top:14px;">
      <a href="/oma-profiili.html" style="color:#2A4B7C; font-size:13px; text-decoration:underline;">Omat asetukset</a>
    </div>
  </div>
</div>
<h1>Omat projektit</h1>
<div id="adminLinkWrap"></div>
<a class="newproj-link" href="/uusiprojekti.html">+ Uusi projekti</a>

<div id="content"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);
  let currentAccessToken = null;

  async function ensureLoggedIn() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.href = '/login.html';
      return false;
    }
    currentAccessToken = session.access_token;
    return true;
  }

  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + currentAccessToken,
    };
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = '/login.html';
  }

  function projectCardHtml(p, showBadge) {
    const created = new Date(p.created_at).toLocaleDateString('fi-FI');
    const badge = showBadge && p.involved ? '<span class="involved-badge">Olet mukana</span>' : '';
    return `
      <a class="card" href="/projekti.html?id=${p.id}">
        ${badge}
        <div class="name">${p.name}</div>
        <div class="meta">Luotu ${created}</div>
      </a>
    `;
  }

  function emptyBlock(text, showButton) {
    const btn = showButton ? '<a class="newproj-link" href="/uusiprojekti.html">+ Uusi projekti</a>' : '';
    return `<p class="empty-note">${text}</p>${btn}`;
  }

  async function loadProjects() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-projects`, {
      method: 'POST',
      headers: authHeaders(),
    });
    const data = await res.json();

    const content = document.getElementById('content');

    if (data.isSuperadmin) {
      document.getElementById('adminLinkWrap').innerHTML =
        '<a class="back" href="/asiakkaat.html">&rarr; Asiakkaat</a>' +
        ' &nbsp;|&nbsp; ' +
        '<a class="back" href="/henkilot.html">&rarr; Henkilöt</a>';

      if (!data.projects || data.projects.length === 0) {
        content.innerHTML = '<p id="empty">Ei vielä yhtään projektia — luo ensimmäinen yllä olevasta painikkeesta.</p>';
      } else {
        content.innerHTML = data.projects.map((p) => projectCardHtml(p, false)).join('');
      }
      return;
    }

    let html = '';

    // Ryhmä 1: Omat projektit — näytetään aina, myös tyhjänä.
    html += '<h3>Omat projektit</h3>';
    if (data.groupOwnInvolved.length === 0) {
      html += emptyBlock('Et ole vielä mukana yhdessäkään projektissa.', true);
    } else {
      html += data.groupOwnInvolved.map((p) => projectCardHtml(p, false)).join('');
    }

    // Ryhmä 2: Oman organisaation kaikki projektit — vain pääkäyttäjälle, aina näkyvissä.
    if (data.isOrgSuperuser && data.ownOrganizationName) {
      html += `<h3>${data.ownOrganizationName} — kaikki projektit</h3>`;
      if (data.groupOwnOrgAll.length === 0) {
        html += emptyBlock('Organisaatiossa ei ole vielä projekteja.', false);
      } else {
        html += data.groupOwnOrgAll.map((p) => projectCardHtml(p, true)).join('');
      }
    }

    // Ryhmä 3: Muiden organisaatioiden projektit — vain jos ei tyhjä.
    if (data.groupOtherOrgsInvolved.length > 0) {
      html += '<h3>Muiden organisaatioiden projektit</h3>';
      html += data.groupOtherOrgsInvolved.map((p) => projectCardHtml(p, false)).join('');
    }

    content.innerHTML = html;
  }

  async function loadMyProfileButton() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-my-profile`, {
      method: 'POST',
      headers: authHeaders(),
    });
    const data = await res.json();
    if (data.error) return;

    const name = (data.firstName || data.lastName) ? `${data.firstName} ${data.lastName}`.trim() : data.email;
    document.getElementById('myProfileBtn').textContent = name;
    document.getElementById('panelName').textContent = name;
    document.getElementById('panelEmail').textContent = data.email;
    document.getElementById('panelOrg').textContent = data.organization || '';
    document.getElementById('panelRole').textContent = data.roleLabel;
  }

  function toggleMyProfilePanel() {
    const panel = document.getElementById('myProfilePanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }

  (async () => {
    const ok = await ensureLoggedIn();
    if (ok) {
      loadProjects();
      loadMyProfileButton();
    }
  })();
</script>
</body>
</html>
