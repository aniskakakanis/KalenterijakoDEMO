<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yhteisikkuna — Omat projektit</title>
<style>
  body { font-family: -apple-system, Segoe UI, Inter, sans-serif; background: #EDF0F3; color: #161B22; max-width: 640px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  button { background: #2A4B7C; color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-bottom: 20px; }
  button:hover { background: #1D3559; }
  .card { background: #fff; border: 1px solid #DBDFE5; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; text-decoration: none; display: block; color: inherit; }
  .card:hover { border-color: #2A4B7C; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .meta { color: #8A93A3; font-size: 12px; margin-top: 4px; }
  #empty { color: #586174; font-size: 14px; }
</style>
</head>
<body>
<button class="secondary" style="float:right;" onclick="logout()">Kirjaudu ulos</button>
<h1>Omat projektit</h1>
<a class="back" href="/uusiprojekti.html" style="display:inline-block; background:#2A4B7C; color:#fff; padding:9px 16px; border-radius:8px; font-size:14px; text-decoration:none; margin-bottom:20px;">+ Uusi projekti</a>
<div id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  let currentAccessToken = null;

  async function ensureLoggedIn() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.href = '/login.html';
      return false;
    }
    currentAccessToken = session.access_token;
    return true;
  }

  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + currentAccessToken,
    };
  }

  async function loadProjects() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-projects`, {
      method: 'POST',
      headers: authHeaders(),
    });
    const data = await res.json();

    const list = document.getElementById('list');
    list.innerHTML = '';

    if (!data.projects || data.projects.length === 0) {
      list.innerHTML = '<p id="empty">Ei vielä yhtään projektia — luo ensimmäinen yllä olevasta painikkeesta.</p>';
      return;
    }

    async function logout() {
      await client.auth.signOut();
      window.location.href = '/login.html';
        }

    data.projects.forEach((p) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = `/projekti.html?id=${p.id}`;
      const created = new Date(p.created_at).toLocaleDateString('fi-FI');
      a.innerHTML = `<div class="name">${p.name}</div><div class="meta">Luotu ${created}</div>`;
      list.appendChild(a);
    });
  }

  async function createProject() {
    const name = prompt('Projektin nimi:');
    if (!name) return;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/create-project`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ name }),
    });
    const data = await res.json();

    if (data.error) {
      alert('Virhe: ' + data.error);
      return;
    }

    window.location.href = `/projekti.html?id=${data.project.id}`;
  }

  (async () => {
    const ok = await ensureLoggedIn();
    if (ok) loadProjects();
  })();
</script>

</body>
</html>
