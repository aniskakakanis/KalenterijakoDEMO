<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yhteisikkuna — Uusi projekti</title>
<style>
  body { font-family: -apple-system, Segoe UI, Inter, sans-serif; background: #EDF0F3; color: #161B22; max-width: 780px; margin: 40px auto; padding: 0 20px 60px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  a.back { font-size: 13px; color: #2A4B7C; text-decoration: none; }
  label { display: block; font-size: 13px; color: #586174; margin-bottom: 4px; }
  input[type=text], input[type=email] { width: 100%; padding: 8px 10px; border: 1px solid #DBDFE5; border-radius: 7px; font-size: 14px; box-sizing: border-box; }
  select { padding: 8px 6px; border: 1px solid #DBDFE5; border-radius: 7px; font-size: 13px; background: #fff; }
  .section { background: #fff; border: 1px solid #DBDFE5; border-radius: 12px; padding: 18px; margin-bottom: 16px; }

  .client-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .client-row input { flex: 1; }
  .client-row button { background: none; border: none; color: #C0453A; cursor: pointer; font-size: 13px; padding: 0 6px; }

  .member-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr 120px 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .member-header { display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr 120px 30px; gap: 8px; font-size: 12px; color: #8A93A3; margin-bottom: 6px; }
  .member-row button.remove { background: none; border: none; color: #C0453A; cursor: pointer; font-size: 16px; }

  button.add { background: #fff; color: #2A4B7C; border: 1px solid #2A4B7C; padding: 7px 14px; border-radius: 7px; font-size: 13px; cursor: pointer; margin-top: 4px; }
  button.submit { background: #2A4B7C; color: #fff; border: none; padding: 11px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 10px; }
  button.submit:hover { background: #1D3559; }
  button.submit:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: #fff; color: #2A4B7C; border: 1px solid #2A4B7C; padding: 11px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 10px; margin-right: 8px; }

  #result { margin-top: 20px; }
  .invite-card { background: #fff; border: 1px solid #DBDFE5; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 13px; }
  .invite-card .email { font-weight: 600; }
  .invite-card a { display: block; margin-top: 4px; word-break: break-all; color: #2A4B7C; }
  .invite-card .email-status { font-size: 11.5px; margin-top: 4px; }
  .invite-card .email-status.ok { color: #1E6B3C; }
  .invite-card .email-status.fail { color: #C0453A; }
  #formError { color: #C0453A; font-size: 13px; margin-top: 10px; }
  .note { font-size: 12px; color: #8A93A3; margin-top: 6px; }

  .domain-row { border-top: 1px solid #EEF1F4; padding: 12px 0; }
  .domain-row:first-child { border-top: none; }
  .domain-row .domain-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
</style>
</head>
<body>

<a class="back" href="/projektit.html">&larr; <span data-i18n="heading_my_projects"></span></a>
<h1 data-i18n="heading_new_project"></h1>

<div id="formStep">
  <div class="section">
    <label for="projectName" data-i18n="project_name_label"></label>
    <input type="text" id="projectName" data-i18n-placeholder="project_name_placeholder" />
  </div>

  <div class="section">
    <h2 style="margin-top:0;" data-i18n="heading_client_orgs"></h2>
    <div id="clientRows">
      <div class="client-row">
        <input type="text" data-i18n-placeholder="client_name_placeholder" />
        <button type="button" onclick="removeClientRow(this)">✕</button>
      </div>
    </div>
    <button class="add" type="button" onclick="addClientRow()" data-i18n="add_new_btn"></button>
  </div>

  <div class="section">
    <h2 style="margin-top:0;" data-i18n="heading_project_members"></h2>
    <div class="member-header">
      <span data-i18n="col_first_name"></span><span data-i18n="col_last_name"></span><span data-i18n="col_title"></span><span data-i18n="col_email"></span><span data-i18n="col_role"></span><span></span>
    </div>
    <div id="memberRows">
      <div class="member-row">
        <input type="text" data-i18n-placeholder="col_first_name" />
        <input type="text" data-i18n-placeholder="col_last_name" />
        <input type="text" data-i18n-placeholder="col_title" />
        <input type="email" placeholder="sahkoposti@yritys.fi" />
        <select>
          <option value="guest" data-i18n="role_guest"></option>
          <option value="admin" data-i18n="role_admin"></option>
        </select>
        <button type="button" class="remove" onclick="removeMemberRow(this)">✕</button>
      </div>
    </div>
        <button class="add" type="button" onclick="addMemberRow()" data-i18n="add_member_btn"></button>
    <div style="margin-top:12px; display:flex; align-items:center; gap:6px; font-size:13px;">
      <input type="checkbox" id="addMyselfCheckbox" />
      <label for="addMyselfCheckbox" style="margin:0;" data-i18n="add_myself_checkbox_label"></label>
    </div>
  </div>
  </div>

  <button class="submit" id="submitBtn" onclick="createProject()" data-i18n="create_project_btn"></button>
  <div id="formError"></div>
</div>

<div id="domainStep" style="display:none;"></div>

<div id="result"></div>

<script src="/translations.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  let currentAccessToken = null;
  let pendingResultData = null;
  let myOwnEmail = null;
  let myOwnFirstName = '';
  let myOwnLastName = '';

  async function ensureLoggedIn() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.href = '/login.html';
      return false;
    }
    currentAccessToken = session.access_token;
    myOwnEmail = session.user.email;
    return true;
  }

  async function loadMyProfileForCheckbox() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-my-profile`, {
      method: 'POST',
      headers: authHeaders(),
    });
    const data = await res.json();
    if (!data.error) {
      myOwnFirstName = data.firstName || '';
      myOwnLastName = data.lastName || '';
    }
  }

  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + currentAccessToken,
    };
  }

  function addClientRow() {
    const div = document.createElement('div');
    div.className = 'client-row';
    div.innerHTML = `
      <input type="text" placeholder="${t('client_name_placeholder')}" />
      <button type="button" onclick="removeClientRow(this)">✕</button>
    `;
    document.getElementById('clientRows').appendChild(div);
  }

  function removeClientRow(btn) {
    const rows = document.getElementById('clientRows');
    if (rows.children.length > 1) btn.parentElement.remove();
  }

  function addMemberRow() {
    const div = document.createElement('div');
    div.className = 'member-row';
    div.innerHTML = `
      <input type="text" placeholder="${t('col_first_name')}" />
      <input type="text" placeholder="${t('col_last_name')}" />
      <input type="text" placeholder="${t('col_title')}" />
      <input type="email" placeholder="sahkoposti@yritys.fi" />
      <select>
        <option value="guest">${t('role_guest')}</option>
        <option value="admin">${t('role_admin')}</option>
      </select>
      <button type="button" class="remove" onclick="removeMemberRow(this)">✕</button>
    `;
    document.getElementById('memberRows').appendChild(div);
  }

  function removeMemberRow(btn) {
    const rows = document.getElementById('memberRows');
    if (rows.children.length > 1) btn.parentElement.remove();
  }

  async function createProject() {
    const errorEl = document.getElementById('formError');
    errorEl.textContent = '';

    const name = document.getElementById('projectName').value.trim();
    if (!name) {
      errorEl.textContent = t('alert_project_name_required');
      return;
    }

    const clientOrganizations = Array.from(document.querySelectorAll('#clientRows .client-row input'))
      .map((el) => el.value.trim())
      .filter((v) => v !== '');

     const members = Array.from(document.querySelectorAll('#memberRows .member-row')).map((row) => {
      const inputs = row.querySelectorAll('input');
      const select = row.querySelector('select');
      return {
        firstName: inputs[0].value.trim(),
        lastName: inputs[1].value.trim(),
        title: inputs[2].value.trim(),
        email: inputs[3].value.trim(),
        role: select.value,
      };
    }).filter((m) => m.email !== '');

    if (document.getElementById('addMyselfCheckbox').checked) {
      const alreadyListed = members.some((m) => m.email.toLowerCase() === myOwnEmail.toLowerCase());
      if (!alreadyListed) {
        members.push({ firstName: myOwnFirstName, lastName: myOwnLastName, title: '', email: myOwnEmail, role: 'admin' });
      }
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = t('creating_label');

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/create-project`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ name, clientOrganizations, members }),
      });
      const data = await res.json();

      if (data.error) {
        errorEl.textContent = t('error_prefix') + ': ' + data.error;
        btn.disabled = false;
        btn.textContent = t('create_project_btn');
        return;
      }

      pendingResultData = data;
      document.getElementById('formStep').style.display = 'none';

      const memberEmails = members.map((m) => m.email);
      const checkRes = await fetch(`${SUPABASE_URL}/functions/v1/check-new-domains`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ emails: memberEmails }),
      });
      const checkData = await checkRes.json();

      if (checkData.newDomains && checkData.newDomains.length > 0) {
        renderDomainStep(checkData.newDomains, data);
      } else {
        renderInviteResult(data);
      }
    } catch (err) {
      errorEl.textContent = t('unexpected_error') + ': ' + err.message;
      btn.disabled = false;
      btn.textContent = t('create_project_btn');
    }
  }

  function renderDomainStep(domains, data) {
    const domainRowsHtml = domains.map((d) => `
      <div class="domain-row" data-domain="${d}">
        <div class="domain-name">${d}</div>
        <label>${t('it_contact_label')}</label>
        <input type="email" class="it-contact-input" placeholder="it-tuki@${d}" />
      </div>
    `).join('');

    document.getElementById('domainStep').innerHTML = `
      <div class="section">
        <h2 style="margin-top:0;">${t('new_org_heading')}</h2>
        <p class="note">${t('new_org_note')}</p>
        ${domainRowsHtml}
        <button class="secondary" type="button" onclick="skipDomainStep()">${t('skip_btn')}</button>
        <button class="submit" type="button" onclick="submitDomainStep()">${t('save_and_continue_btn')}</button>
      </div>
    `;
    document.getElementById('domainStep').style.display = 'block';
  }

  async function saveDomainEntries(withContacts) {
    const rows = Array.from(document.querySelectorAll('#domainStep .domain-row')).map((row) => {
      const domain = row.getAttribute('data-domain');
      const itContactEmail = withContacts ? row.querySelector('.it-contact-input').value.trim() : '';
      return { domain, itContactEmail };
    });

    await fetch(`${SUPABASE_URL}/functions/v1/register-domain-contacts`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ entries: rows, context: `project:${pendingResultData.project.id}` }),
    });
  }

  async function submitDomainStep() {
    await saveDomainEntries(true);
    document.getElementById('domainStep').style.display = 'none';
    renderInviteResult(pendingResultData);
  }

  async function skipDomainStep() {
    await saveDomainEntries(false);
    document.getElementById('domainStep').style.display = 'none';
    renderInviteResult(pendingResultData);
  }

  function renderInviteResult(data) {
    const resultEl = document.getElementById('result');
    let html = `<h2>${t('project_created_heading', { name: data.project.name })}</h2>`;

    data.invites.forEach((inv) => {
      if (inv.error) {
        html += `<div class="invite-card"><span class="email">${inv.email}</span> — ${t('error_prefix')}: ${inv.error}</div>`;
      } else {
        const statusHtml = inv.emailSent
          ? `<div class="email-status ok">✓ ${t('email_sent_ok')}</div>`
          : `<div class="email-status fail">${t('email_sent_fail')}</div>`;
        html += `<div class="invite-card"><span class="email">${inv.email}</span><a href="${inv.inviteLink}" target="_blank">${inv.inviteLink}</a>${statusHtml}</div>`;
      }
    });

    html += `<button class="submit" onclick="window.location.href='/projekti.html?id=${data.project.id}'">${t('go_to_project_btn')}</button>`;
    resultEl.innerHTML = html;
  }

  (async () => {
    const ok = await ensureLoggedIn();
    applyStaticTranslations();
    if (ok) loadMyProfileForCheckbox();
  })();
</script>

</body>
</html>
