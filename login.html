<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yhteisikkuna — Kirjaudu</title>
<style>
  body { font-family: -apple-system, Segoe UI, Inter, sans-serif; background: #EDF0F3; color: #161B22; max-width: 360px; margin: 100px auto; padding: 0 20px; }
  h1 { font-size: 20px; }
  input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #DBDFE5; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
  button { width: 100%; background: #2A4B7C; color: #fff; border: none; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1D3559; }
  button.secondary { background: #fff; color: #2A4B7C; border: 1px solid #2A4B7C; margin-top: 14px; }
  #status { margin-top: 12px; font-size: 13px; color: #C0453A; }
  .divider { display: flex; align-items: center; text-align: center; color: #8A93A3; font-size: 12px; margin: 18px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #DBDFE5; }
  .divider::before { margin-right: 10px; }
  .divider::after { margin-left: 10px; }
</style>
</head>
<body>

<h1>Kirjaudu sisään</h1>

<input type="email" id="email" placeholder="Sähköposti" />
<input type="password" id="password" placeholder="Salasana" />
<button onclick="login()">Kirjaudu</button>
<div id="status"></div>

<div class="divider">tai</div>

<button class="secondary" onclick="loginWithMicrosoft()">Kirjaudu Microsoft-tilillä</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  async function checkAccessAndRedirect() {
    const { data: { session } } = await client.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/check-app-access`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + session.access_token,
      },
    });
    const data = await res.json();

    if (!data.authorized) {
      await client.auth.signOut();
      document.getElementById('status').textContent =
        'Ei käyttöoikeutta tähän sovellukseen. Ota yhteyttä pääkäyttäjään, jos tämä on virhe.';
      return;
    }

    window.location.href = '/projektit.html';
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { data, error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      document.getElementById('status').textContent = 'Virhe: ' + error.message;
      return;
    }

    await checkAccessAndRedirect();
  }

 function loginWithMicrosoft() {
    client.auth.signInWithOAuth({
      provider: 'azure',
      options: {
        scopes: 'email',
        redirectTo: window.location.origin + '/login.html',
      },
    });
  }

  (async () => {
    const { data: { session } } = await client.auth.getSession();
    if (session) {
      await checkAccessAndRedirect();
    }
  })();
</script>

</body>
</html>
