<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yhteisikkuna — Kirjaudu</title>
<style>
  body { font-family: -apple-system, Segoe UI, Inter, sans-serif; background: #EDF0F3; color: #161B22; max-width: 360px; margin: 100px auto; padding: 0 20px; position: relative; }
  h1 { font-size: 20px; }
  input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #DBDFE5; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
  button { width: 100%; background: #2A4B7C; color: #fff; border: none; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1D3559; }
  button.secondary { background: #fff; color: #2A4B7C; border: 1px solid #2A4B7C; margin-top: 14px; }
  #status { margin-top: 12px; font-size: 13px; color: #C0453A; }
  .divider { display: flex; align-items: center; text-align: center; color: #8A93A3; font-size: 12px; margin: 18px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #DBDFE5; }
  .divider::before { margin-right: 10px; }
  .divider::after { margin-left: 10px; }

  .flag-picker { position: absolute; top: -60px; right: 20px; display: flex; gap: 6px; }
  .flag-btn { background: none; border: 1px solid transparent; border-radius: 6px; font-size: 20px; padding: 2px 6px; cursor: pointer; line-height: 1; }
  .flag-btn.active { border-color: #2A4B7C; background: #fff; }
</style>
</head>
<body>

<div class="flag-picker">
  <button type="button" class="flag-btn" id="flagFi" onclick="setLoginLanguage('fi')">🇫🇮</button>
  <button type="button" class="flag-btn" id="flagEn" onclick="setLoginLanguage('en')">🇬🇧</button>
</div>

<h1 data-i18n="login_heading"></h1>

<input type="email" id="email" data-i18n-placeholder="email_placeholder" />
<input type="password" id="password" data-i18n-placeholder="password_placeholder" />
<button onclick="login()" data-i18n="login_btn"></button>
<div id="status"></div>

<div class="divider" data-i18n="divider_or"></div>

<button class="secondary" onclick="loginWithMicrosoft()" data-i18n="login_microsoft_btn"></button>
<button class="secondary" onclick="loginWithGoogle()" data-i18n="login_google_btn"></button>

<script src="/translations.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  function updateFlagActiveState() {
    const lang = getCurrentLanguage();
    document.getElementById('flagFi').classList.toggle('active', lang === 'fi');
    document.getElementById('flagEn').classList.toggle('active', lang === 'en');
  }

  function setLoginLanguage(lang) {
    setCurrentLanguage(lang);
    applyStaticTranslations();
    updateFlagActiveState();
  }

    let sessionToken = null;

  async function checkAccessAndRedirect() {
    const { data: { session } } = await client.auth.getSession();
    sessionToken = session.access_token;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/check-app-access`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + sessionToken,
      },
    });
    const data = await res.json();

    if (!data.authorized) {
      await client.auth.signOut();
      document.getElementById('status').textContent =
        'Ei käyttöoikeutta tähän sovellukseen. Ota yhteyttä pääkäyttäjään, jos tämä on virhe.';
      return;
    }

    const profileRes = await fetch(`${SUPABASE_URL}/functions/v1/get-my-profile`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + sessionToken,
      },
    });
    const profileData = await profileRes.json();

    if (!profileData.profileCompleted) {
      showFirstLoginProfilePopup();
      return;
    }

    window.location.href = '/projektit.html';
  }

  function showFirstLoginProfilePopup() {
    document.body.insertAdjacentHTML('beforeend', `
      <div id="profilePopupOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; z-index:10;">
        <div style="background:#fff; border-radius:12px; padding:22px; width:340px; max-width:90vw;">
          <h3 style="margin-top:0;">${t('complete_profile_heading')}</h3>
          <label>${t('first_name_label')}</label>
          <input type="text" id="fpFirstName" />
          <label>${t('last_name_label')}</label>
          <input type="text" id="fpLastName" />
          <label>${t('title_label')}</label>
          <input type="text" id="fpTitle" />
          <label>${t('organization_label')}</label>
          <input type="text" id="fpOrganization" />
          <button style="margin-top:16px;" onclick="submitFirstLoginProfile()">${t('save_and_continue_btn')}</button>
        </div>
      </div>
    `);
  }

  async function submitFirstLoginProfile() {
    const body = {
      firstName: document.getElementById('fpFirstName').value,
      lastName: document.getElementById('fpLastName').value,
      title: document.getElementById('fpTitle').value,
      organization: document.getElementById('fpOrganization').value,
      language: getCurrentLanguage(),
    };

    await fetch(`${SUPABASE_URL}/functions/v1/update-my-profile`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + sessionToken,
      },
      body: JSON.stringify(body),
    });

    window.location.href = '/projektit.html';
  }
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { data, error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      document.getElementById('status').textContent = t('error_prefix') + ': ' + error.message;
      return;
    }

    await checkAccessAndRedirect();
  }

  function loginWithMicrosoft() {
    client.auth.signInWithOAuth({
      provider: 'azure',
      options: {
        scopes: 'email',
        redirectTo: window.location.origin + '/login.html',
      },
    });
  }

  function loginWithGoogle() {
    client.auth.signInWithOAuth({
      provider: 'google',
      options: {
        scopes: 'email',
        redirectTo: window.location.origin + '/login.html',
      },
    });
  }

  applyStaticTranslations();
  updateFlagActiveState();

  (async () => {
    const { data: { session } } = await client.auth.getSession();
    if (session) {
      await checkAccessAndRedirect();
    }
  })();
</script>

</body>
</html>
