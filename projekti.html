<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yhteisikkuna — Projektin hallinta</title>
<style>
  body { font-family: -apple-system, Segoe UI, Inter, sans-serif; background: #EDF0F3; color: #161B22; max-width: 860px; margin: 40px auto; padding: 0 20px 60px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h3 { font-size: 14px; margin: 0 0 10px; }
  p.sub { color: #586174; font-size: 14px; margin-top: 0; }
  a.back { font-size: 13px; color: #2A4B7C; text-decoration: none; }
  button { background: #2A4B7C; color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-right: 8px; }
  button:hover { background: #1D3559; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.secondary { background: #fff; color: #2A4B7C; border: 1px solid #2A4B7C; }
  button.danger { background: #fff; color: #C0453A; border: 1px solid #C0453A; }
  button.danger:hover { background: #FBE4E1; }
  .toolbar { margin: 16px 0 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .toolbar .fetched { font-size: 12px; color: #8A93A3; margin-left: 4px; }
  #inviteResult { margin: 10px 0 16px; font-size: 13px; word-break: break-all; }

  .date-bar { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; font-size: 13px; color: #586174; background: #fff; border: 1px solid #DBDFE5; border-radius: 10px; padding: 10px 14px; flex-wrap: wrap; }
  .date-bar input[type=date], .date-bar input[type=time] { border: 1px solid #DBDFE5; border-radius: 6px; padding: 5px 7px; font-size: 13px; }
  .date-bar .today-btn { padding: 5px 10px; font-size: 12px; margin: 0; }

  .board-block { margin-bottom: 22px; }
  .board { background: #fff; border: 1px solid #DBDFE5; border-radius: 12px; padding: 14px 16px; }
  .board-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

  .dual-pane { display: flex; }
  .names-col { width: 168px; flex: 0 0 168px; }
  .timeline-col { flex: 1; overflow-x: auto; overflow-y: hidden; }
  .timeline-col.follower { overflow-x: hidden; }

  .header-spacer { height: 18px; }
  .ruler-cell { width: 9600px; height: 18px; position: relative; }
  .day-label { position: absolute; top: 0; height: 16px; font-size: 10px; color: #8A93A3; border-left: 1px solid #DBDFE5; padding-left: 4px; box-sizing: border-box; }

  .name-row, .timeline-row { height: 34px; display: flex; align-items: center; }
  .name-row + .name-row, .timeline-row + .timeline-row { border-top: 1px solid #EEF1F4; }
  .name-row { gap: 6px; padding-right: 6px; }
  .name-row input[type=checkbox] { flex: 0 0 auto; }
  .name-row .checkbox-spacer { width: 14px; flex: 0 0 14px; }
  .name-row .email { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name-row.clickable { cursor: pointer; }
  .name-row.clickable:hover .email { text-decoration: underline; }

  .timeline-row { width: 9600px; position: relative; }
  .timeline-row.clickable { cursor: pointer; }
  .timeline-cell { width: 9600px; position: relative; height: 24px; }
  .day-bg { position: absolute; top: 0; bottom: 0; background: #EEF1F4; border-radius: 6px; border: 1px solid #DBDFE5; box-sizing: border-box; }
  .busy-block { position: absolute; top: 2px; bottom: 2px; background: #E8938A; border-radius: 3px; z-index: 1; }
  .now-line { position: absolute; top: -20px; bottom: 0; width: 2px; background: #2A4B7C; z-index: 2; }
  .no-data { color: #8A93A3; font-size: 12.5px; width: 9600px; }

  .names-rows { overflow: hidden; }
  .timeline-rows { overflow-y: auto; overflow-x: hidden; width: 9600px; }
  .rows-people { max-height: 238px; }
  .rows-groups { max-height: 136px; }

  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; }
  .badge.groupvis { background: #E1E6EF; color: #2A4B7C; }

  .empty-note { color: #8A93A3; font-size: 12.5px; padding: 6px 0; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 10; overflow-y: auto; padding: 30px 0; }
  .modal { background: #fff; border-radius: 12px; padding: 22px; width: 380px; max-width: 90vw; }
  .modal.settings-modal { width: 460px; max-height: 85vh; overflow-y: auto; }
  .modal h3 { margin-top: 0; }
  .modal .selected-list { font-size: 13px; color: #586174; margin-bottom: 12px; max-height: 100px; overflow-y: auto; }
  .modal label { display: block; font-size: 13px; color: #586174; margin: 10px 0 4px; }
  .modal input[type=text] { width: 100%; padding: 8px; border: 1px solid #DBDFE5; border-radius: 7px; font-size: 14px; box-sizing: border-box; }
  .modal .visibility-choice { display: flex; gap: 16px; font-size: 13px; margin-top: 4px; }
  .modal .actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 8px; }

  .member-line { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 13.5px; }
  .member-line + .member-line { border-top: 1px solid #EEF1F4; }
  .member-line .remove-x { color: #C0453A; cursor: pointer; font-size: 14px; background: none; border: none; padding: 0 4px; margin: 0; }
  .add-member-row { display: flex; gap: 6px; margin-top: 12px; }
  .add-member-row select { flex: 1; padding: 7px; border: 1px solid #DBDFE5; border-radius: 7px; font-size: 13px; }
  .add-member-row button { padding: 7px 12px; font-size: 13px; margin: 0; }

  .day-block { border-top: 1px solid #EEF1F4; padding: 8px 0; }
  .day-toggle { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: #161B22; margin: 0; }
  .ranges { margin: 8px 0 4px 24px; }
  .range-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .range-row input[type=time] { padding: 5px; border: 1px solid #DBDFE5; border-radius: 6px; font-size: 12.5px; }
  .range-row .remove-x { color: #C0453A; background: none; border: none; cursor: pointer; padding: 0 4px; margin: 0; }
  .add-range-btn { padding: 5px 10px; font-size: 12px; margin: 2px 0 0; }

  .blackout-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .blackout-row input[type=datetime-local] { padding: 5px; border: 1px solid #DBDFE5; border-radius: 6px; font-size: 12.5px; }
  .blackout-row .remove-x { color: #C0453A; background: none; border: none; cursor: pointer; padding: 0 4px; margin: 0; }
  .fully-hidden-row { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-top: 18px; }

  .calendar-section { border: 1px solid #DBDFE5; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .calendar-section .ok-text { color: #1E6B3C; font-size: 13px; }
  .calendar-section .warn-text { color: #C0453A; font-size: 13px; font-weight: 600; }
  .calendar-section .meta { color: #8A93A3; font-size: 12px; margin-top: 4px; }

  .danger-zone { border-top: 1px solid #EEF1F4; margin-top: 18px; padding-top: 14px; }
</style>
</head>
<body>

<button class="secondary" style="float:right;" onclick="logout()">Kirjaudu ulos</button>
<a class="back" href="/projektit.html">&larr; Kaikki projektit</a>
<h1 id="projectName">Ladataan projektia…</h1>
<p class="sub" id="projectOwner"></p>

<div class="toolbar">
  <button id="addGroupBtn" class="secondary" disabled onclick="openGroupModal()">+ Uusi ryhmä</button>
  <button onclick="addParticipant()">+ Lisää osallistuja</button>
  <button class="secondary" onclick="refreshSchedules()">Päivitä aikataulut</button>
  <button class="secondary" onclick="openSettingsModal()">Asetukset</button>
  <span class="fetched" id="fetchedSummary"></span>
</div>
<div id="inviteResult"></div>

<div class="date-bar">
  <span>Näytettävä päivä</span>
  <input type="date" id="viewDate" onchange="onViewDateChange()" />
  <button type="button" class="secondary today-btn" onclick="jumpToToday()">Tänään</button>
  <span style="margin-left:12px;">Siirry ajankohtaan</span>
  <input type="time" id="jumpTime" step="1800" />
  <button type="button" class="secondary today-btn" onclick="jumpToTime()">Siirry</button>
</div>

<div class="board-block">
  <div class="board">
    <h3>Projektin henkilöt</h3>
    <div class="dual-pane">
      <div class="names-col">
        <div class="header-spacer"></div>
        <div class="name-row"><span class="checkbox-spacer"></span><span class="email">Koko projekti</span></div>
        <div class="names-rows rows-people" id="peopleNamesRows"></div>
      </div>
      <div class="timeline-col" id="peopleTimelineCol">
        <div class="ruler-cell" id="peopleRuler"></div>
        <div class="timeline-row" id="summaryTimelineRow"></div>
        <div class="timeline-rows rows-people" id="peopleTimelineRows"></div>
      </div>
    </div>
  </div>
</div>

<div class="board-block">
  <div class="board">
    <h3>Omat ryhmät</h3>
    <div class="dual-pane">
      <div class="names-col">
        <div class="header-spacer"></div>
        <div class="names-rows rows-groups" id="ownGroupNames"></div>
      </div>
      <div class="timeline-col follower" id="ownGroupsTimelineCol">
        <div class="ruler-cell" id="ownGroupsRuler"></div>
        <div class="timeline-rows rows-groups" id="ownGroupTimelines"></div>
      </div>
    </div>
    <div id="ownGroupsEmpty"></div>
  </div>
</div>

<div class="board-block">
  <div class="board">
    <h3>Projektin ryhmät</h3>
    <div class="dual-pane">
      <div class="names-col">
        <div class="header-spacer"></div>
        <div class="names-rows rows-groups" id="projectGroupNames"></div>
      </div>
      <div class="timeline-col follower" id="projectGroupsTimelineCol">
        <div class="ruler-cell" id="projectGroupsRuler"></div>
        <div class="timeline-rows rows-groups" id="projectGroupTimelines"></div>
      </div>
    </div>
    <div id="projectGroupsEmpty"></div>
  </div>
</div>

<div id="modalHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const paramsUrl = new URLSearchParams(window.location.search);
  const PROJECT_ID = paramsUrl.get('id');

  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  const HOUR_PX = 80;
  const PX_PER_MIN = HOUR_PX / 60;
  const DAY_PX = 24 * HOUR_PX; // 1920
  const BUFFER_DAYS = 5;
  const TOTAL_PX = BUFFER_DAYS * DAY_PX; // 9600
  const HOME_SCROLL = 1 * DAY_PX; // 1/5 vasemmalta
  const WEEKDAY_LABELS = ['Ma', 'Ti', 'Ke', 'To', 'Pe', 'La', 'Su'];

  const CLIENT_ID = "54f922c6-aa24-44b4-9305-f28964c09f96";
  const CALENDAR_REDIRECT_URI = "https://nrrhvbxvkizvkcwwglck.supabase.co/functions/v1/auth-callback";

  let currentAccessToken = null;
  let currentUserEmail = null;
  let latestStatus = null;
  let anchorDateStr = null; // puskurin "keskuspäivä" (indeksi 1 viidestä)
  let settingsState = null;
  let expiredPopupShown = false;
  let scrollEndTimer = null;
  const selectedParticipantIds = new Set();

  async function ensureLoggedIn() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.href = '/login.html';
      return false;
    }
    currentAccessToken = session.access_token;
    return true;
  }

  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + currentAccessToken,
    };
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = '/login.html';
  }

  function toDateStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todayDateStr() {
    return toDateStr(new Date());
  }

  function addDaysToStr(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return toDateStr(d);
  }

  // Puskuri = 5 päivää: [ankkuri-1, ankkuri, ankkuri+1, ankkuri+2, ankkuri+3]
  function bufferDates() {
    const arr = [];
    for (let i = -1; i <= 3; i++) arr.push(addDaysToStr(anchorDateStr, i));
    return arr;
  }

  function itemDateStr(item) {
    const d = new Date(item.start.dateTime + 'Z');
    return toDateStr(d);
  }

  function rulerHtml() {
    const dates = bufferDates();
    let html = '';
    dates.forEach((dateStr, i) => {
      const d = new Date(dateStr + 'T00:00:00');
      const label = WEEKDAY_LABELS[(d.getDay() + 6) % 7] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.';
      html += `<div class="day-label" style="left:${i * DAY_PX}px; width:${DAY_PX}px;">${label}</div>`;
    });
    return html;
  }

  function dayBackgroundsHtml() {
    let html = '';
    for (let i = 0; i < BUFFER_DAYS; i++) {
      html += `<div class="day-bg" style="left:${i * DAY_PX + 1}px; width:${DAY_PX - 2}px;"></div>`;
    }
    return html;
  }

  function busyBlocksHtml(items) {
    const dates = bufferDates();
    let html = '';
    (items || []).forEach((item) => {
      if (item.status !== 'busy') return;
      const dateStr = itemDateStr(item);
      const dayIdx = dates.indexOf(dateStr);
      if (dayIdx === -1) return;

      const start = new Date(item.start.dateTime + 'Z');
      const end = new Date(item.end.dateTime + 'Z');
      const startMin = start.getHours() * 60 + start.getMinutes();
      let endMin = end.getHours() * 60 + end.getMinutes();
      if (endMin <= startMin) endMin = 1440;

      const leftPx = dayIdx * DAY_PX + startMin * PX_PER_MIN;
      const widthPx = (endMin - startMin) * PX_PER_MIN;
      const startLabel = start.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
      const endLabel = end.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
      html += `<div class="busy-block" style="left:${leftPx}px; width:${widthPx}px;" title="Varattu ${startLabel}–${endLabel}"></div>`;
    });
    return html;
  }

  function nowLineHtml() {
    const dates = bufferDates();
    const todayIdx = dates.indexOf(todayDateStr());
    if (todayIdx === -1) return '';
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const leftPx = todayIdx * DAY_PX + nowMin * PX_PER_MIN;
    return `<div class="now-line" style="left:${leftPx}px;"></div>`;
  }

  function timelineCellHtml(items) {
    return `<div class="timeline-cell">${dayBackgroundsHtml()}${busyBlocksHtml(items)}${nowLineHtml()}</div>`;
  }

  function isAdminForProject(status) {
    if (!status) return false;
    if (status.project.owner_email.toLowerCase() === currentUserEmail) return true;
    return status.participants.some(
      (p) => p.email.toLowerCase() === currentUserEmail && p.role === 'admin' && p.status === 'authorized'
    );
  }

  function canEditGroup(g) {
    if (!latestStatus) return false;
    if (g.visibility === 'private') return g.isOwn;
    return isAdminForProject(latestStatus);
  }

  function linkVerticalScroll(namesEl, timelineEl) {
    timelineEl.addEventListener('scroll', () => {
      namesEl.scrollTop = timelineEl.scrollTop;
    });
  }

  function mirrorHorizontalScroll(scrollLeft) {
    document.getElementById('ownGroupsTimelineCol').scrollLeft = scrollLeft;
    document.getElementById('projectGroupsTimelineCol').scrollLeft = scrollLeft;
  }

  function setHomeScroll() {
    document.getElementById('peopleTimelineCol').scrollLeft = HOME_SCROLL;
    mirrorHorizontalScroll(HOME_SCROLL);
  }

  function pageBuffer(direction) {
    anchorDateStr = addDaysToStr(anchorDateStr, direction * 4);
    document.getElementById('viewDate').value = anchorDateStr;
    renderAll();
    setHomeScroll();
  }

  // Odotetaan että vieritys (myös trackpadin liu'utus) on aidosti loppunut,
  // ennen kuin päätellään ollaanko reunassa ja tehdään sivutus — sama
  // periaate kuin Outlookin scheduler-näkymässä.
  function attachMasterPaging() {
    const master = document.getElementById('peopleTimelineCol');
    master.addEventListener('scroll', () => {
      mirrorHorizontalScroll(master.scrollLeft);
      clearTimeout(scrollEndTimer);
      scrollEndTimer = setTimeout(() => {
        const max = master.scrollWidth - master.clientWidth;
        if (master.scrollLeft >= max - 4) {
          pageBuffer(1);
        } else if (master.scrollLeft <= 0) {
          pageBuffer(-1);
        }
      }, 120);
    });
  }

  function defaultJumpTimeValue() {
    const now = new Date();
    let m = now.getMinutes() < 30 ? 0 : 30;
    return String(now.getHours()).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  function nameLabelFor(p) {
    return (p.firstName || p.lastName) ? `${p.firstName || ''} ${p.lastName || ''}`.trim() : p.email;
  }

  function onViewDateChange() {
    const val = document.getElementById('viewDate').value;
    if (!val) return;
    anchorDateStr = val;
    renderAll();
    setHomeScroll();
  }

  function jumpToToday() {
    anchorDateStr = todayDateStr();
    document.getElementById('viewDate').value = anchorDateStr;
    renderAll();
    setHomeScroll();
  }

  function jumpToTime() {
    const timeVal = document.getElementById('jumpTime').value;
    if (!timeVal) return;
    const [h, m] = timeVal.split(':').map(Number);
    const leftPx = HOME_SCROLL + (h * 60 + m) * PX_PER_MIN;
    document.getElementById('peopleTimelineCol').scrollLeft = leftPx;
    mirrorHorizontalScroll(leftPx);
  }

  function startCalendarAuthForParticipant(participantId) {
    const authUrl = new URL('https://login.microsoftonline.com/common/oauth2/v2.0/authorize');
    authUrl.searchParams.set('client_id', CLIENT_ID);
    authUrl.searchParams.set('response_type', 'code');
    authUrl.searchParams.set('redirect_uri', CALENDAR_REDIRECT_URI);
    authUrl.searchParams.set('response_mode', 'query');
    authUrl.searchParams.set('scope', 'User.Read Calendars.Read offline_access');
    authUrl.searchParams.set('state', participantId);
    window.location.href = authUrl.toString();
  }

  async function loadStatus() {
    if (!PROJECT_ID) {
      document.getElementById('projectName').textContent = 'Virhe: projektin id puuttuu osoitteesta';
      return;
    }

    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-project-status`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();

    if (data.error) {
      document.getElementById('projectName').textContent = 'Virhe: ' + data.error;
      return;
    }

    latestStatus = data;
    currentUserEmail = data.currentUserEmail;

    if (!anchorDateStr) {
      anchorDateStr = todayDateStr();
      document.getElementById('viewDate').value = anchorDateStr;
      document.getElementById('jumpTime').value = defaultJumpTimeValue();
    }

    renderAll();
    checkExpiredCalendar();
  }

  function checkExpiredCalendar() {
    if (expiredPopupShown || !latestStatus) return;
    const mine = latestStatus.participants.find((p) => p.email.toLowerCase() === currentUserEmail);
    if (mine && mine.status === 'expired') {
      expiredPopupShown = true;
      document.getElementById('modalHost').innerHTML = `
        <div class="modal-overlay">
          <div class="modal">
            <h3>Kalenterivaltuutus vanhentunut</h3>
            <p class="sub">Projektin <strong>${latestStatus.project.name}</strong> Microsoft-valtuutus on vanhentunut. Liitä kalenteri sovellukseen alta.</p>
            <div class="actions">
              <button class="secondary" onclick="closeModal()">Sulje</button>
              <button onclick="startCalendarAuthForParticipant('${mine.id}')">Liitä kalenteri</button>
            </div>
          </div>
        </div>
      `;
    }
  }

  function renderAll() {
    const data = latestStatus;
    if (!data) return;

    document.getElementById('projectName').textContent = data.project.name;
    document.getElementById('projectOwner').textContent = 'Vastuuhenkilö: ' + data.project.owner_email;

    document.getElementById('peopleRuler').innerHTML = rulerHtml();
    document.getElementById('ownGroupsRuler').innerHTML = rulerHtml();
    document.getElementById('projectGroupsRuler').innerHTML = rulerHtml();

    const authorized = data.participants.filter((p) => p.status === 'authorized' && p.fetchedAt);
    const fetchedEl = document.getElementById('fetchedSummary');
    fetchedEl.textContent = authorized.length === 0
      ? 'Ei vielä haettuja aikatauluja'
      : 'Haettu: ' + new Date(authorized.reduce((a, b) => (new Date(a.fetchedAt) > new Date(b.fetchedAt) ? a : b)).fetchedAt).toLocaleString('fi-FI');

    const allBusy = [];
    authorized.forEach((p) => { if (p.scheduleItems) allBusy.push(...p.scheduleItems); });
    document.getElementById('summaryTimelineRow').innerHTML = timelineCellHtml(allBusy);

    const namesEl = document.getElementById('peopleNamesRows');
    const timelinesEl = document.getElementById('peopleTimelineRows');
    namesEl.innerHTML = '';
    timelinesEl.innerHTML = '';

    data.participants.forEach((p) => {
      const nameRow = document.createElement('div');
      nameRow.className = 'name-row';
      const checked = selectedParticipantIds.has(p.id) ? 'checked' : '';
      nameRow.innerHTML = `
        <input type="checkbox" data-pid="${p.id}" ${checked} onchange="toggleParticipant('${p.id}', this.checked)" />
        <span class="email">${nameLabelFor(p)}</span>
      `;
      namesEl.appendChild(nameRow);

      const tRow = document.createElement('div');
      tRow.className = 'timeline-row';
      tRow.innerHTML = p.scheduleItems === null
        ? '<div class="no-data">Ei vielä haettua aikataulua</div>'
        : timelineCellHtml(p.scheduleItems);
      timelinesEl.appendChild(tRow);
    });

    const ownGroups = (data.groups || []).filter((g) => g.visibility === 'private' && g.isOwn);
    const projectGroups = (data.groups || []).filter((g) => g.visibility === 'project');

    renderGroupBoard(ownGroups, 'ownGroupNames', 'ownGroupTimelines', 'ownGroupsEmpty', 'Ei vielä omia ryhmiä.');
    renderGroupBoard(projectGroups, 'projectGroupNames', 'projectGroupTimelines', 'projectGroupsEmpty', 'Ei vielä projektin ryhmiä.');
  }

  function groupMergedItems(g) {
    const allItems = [];
    (g.members || []).forEach((m) => { if (m.scheduleItems) allItems.push(...m.scheduleItems); });
    return allItems;
  }

  function renderGroupBoard(groups, namesId, timelinesId, emptyId, emptyText) {
    const namesEl = document.getElementById(namesId);
    const timelinesEl = document.getElementById(timelinesId);
    const emptyEl = document.getElementById(emptyId);
    namesEl.innerHTML = '';
    timelinesEl.innerHTML = '';

    if (groups.length === 0) {
      emptyEl.innerHTML = `<p class="empty-note">${emptyText}</p>`;
      return;
    }
    emptyEl.innerHTML = '';

    groups.forEach((g) => {
      const nameRow = document.createElement('div');
      nameRow.className = 'name-row clickable';
      nameRow.onclick = () => openGroupDetail(g.id);
      nameRow.innerHTML = `<span class="checkbox-spacer"></span><span class="email">${g.name}</span>`;
      namesEl.appendChild(nameRow);

      const tRow = document.createElement('div');
      tRow.className = 'timeline-row clickable';
      tRow.onclick = () => openGroupDetail(g.id);
      tRow.innerHTML = timelineCellHtml(groupMergedItems(g));
      timelinesEl.appendChild(tRow);
    });
  }

  function toggleParticipant(id, checked) {
    if (checked) selectedParticipantIds.add(id);
    else selectedParticipantIds.delete(id);
    document.getElementById('addGroupBtn').disabled = selectedParticipantIds.size === 0;
  }

  async function addParticipant() {
    const email = prompt('Osallistujan sähköposti:');
    if (!email) return;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/invite-participant`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID, email }),
    });
    const data = await res.json();

    if (data.error) {
      document.getElementById('inviteResult').textContent = 'Virhe: ' + data.error;
      return;
    }

    document.getElementById('inviteResult').innerHTML =
      'Kutsulinkki: <a href="' + data.inviteLink + '" target="_blank">' + data.inviteLink + '</a>';

    loadStatus();
  }

  async function refreshSchedules() {
    const statusRes = await fetch(`${SUPABASE_URL}/functions/v1/get-project-status`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const statusData = await statusRes.json();

    const authorizedIds = statusData.participants
      .filter((p) => p.status === 'authorized')
      .map((p) => p.id);

    if (authorizedIds.length === 0) {
      alert('Ei vielä yhtään valtuutettua osallistujaa.');
      return;
    }

    const now = new Date();
    const localStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
    const localEnd = new Date(now.getFullYear(), now.getMonth() + 3, now.getDate(), 0, 0, 0);
    const startTime = localStart.toISOString().slice(0, 19);
    const endTime = localEnd.toISOString().slice(0, 19);

    await fetch(`${SUPABASE_URL}/functions/v1/get-schedule`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ participantIds: authorizedIds, startTime, endTime }),
    });

    loadStatus();
  }

  function openGroupModal() {
    if (selectedParticipantIds.size === 0 || !latestStatus) return;

    const selectedPeople = latestStatus.participants.filter((p) => selectedParticipantIds.has(p.id));
    const admin = isAdminForProject(latestStatus);

    const listHtml = selectedPeople.map((p) => `<div>${nameLabelFor(p)}</div>`).join('');

    const visibilityHtml = admin ? `
      <label>Ryhmän näkyvyys</label>
      <div class="visibility-choice">
        <label><input type="radio" name="visibility" value="private" checked /> Oma ryhmä</label>
        <label><input type="radio" name="visibility" value="project" /> Projektin ryhmä</label>
      </div>
    ` : '';

    document.getElementById('modalHost').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h3>Uusi ryhmä</h3>
          <div class="selected-list">${listHtml}</div>
          <label>Ryhmän nimi</label>
          <input type="text" id="groupNameInput" placeholder="esim. Johtoryhmä" />
          ${visibilityHtml}
          <div class="actions">
            <button class="secondary" onclick="closeModal()">Peruuta</button>
            <button onclick="submitGroup()">Luo ryhmä</button>
          </div>
        </div>
      </div>
    `;
  }

  function closeModal() {
    document.getElementById('modalHost').innerHTML = '';
  }

  async function submitGroup() {
    const name = document.getElementById('groupNameInput').value.trim();
    if (!name) {
      alert('Anna ryhmälle nimi.');
      return;
    }

    const visibilityInput = document.querySelector('input[name="visibility"]:checked');
    const visibility = visibilityInput ? visibilityInput.value : 'private';

    const res = await fetch(`${SUPABASE_URL}/functions/v1/create-group`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        projectId: PROJECT_ID,
        name,
        participantIds: Array.from(selectedParticipantIds),
        visibility,
      }),
    });
    const data = await res.json();

    if (data.error) {
      alert('Virhe: ' + data.error);
      return;
    }

    selectedParticipantIds.clear();
    document.getElementById('addGroupBtn').disabled = true;
    closeModal();
    loadStatus();
  }

  function openGroupDetail(groupId) {
    const g = (latestStatus.groups || []).find((x) => x.id === groupId);
    if (!g) return;

    const editable = canEditGroup(g);
    const memberIds = new Set((g.members || []).map((m) => m.participantId));

    const memberLinesHtml = (g.members || []).map((m) => {
      const p = latestStatus.participants.find((pp) => pp.id === m.participantId);
      const label = p ? nameLabelFor(p) : m.email;
      const removeBtn = editable
        ? `<button class="remove-x" onclick="removeGroupMember('${groupId}', '${m.participantId}')">✕</button>`
        : '';
      return `<div class="member-line"><span>${label}</span>${removeBtn}</div>`;
    }).join('') || '<p class="empty-note">Ei jäseniä.</p>';

    let addRowHtml = '';
    if (editable) {
      const availableOptions = latestStatus.participants
        .filter((p) => !memberIds.has(p.id))
        .map((p) => `<option value="${p.id}">${nameLabelFor(p)}</option>`)
        .join('');

      addRowHtml = availableOptions
        ? `
          <div class="add-member-row">
            <select id="addMemberSelect">${availableOptions}</select>
            <button onclick="addGroupMember('${groupId}')">Lisää jäsen</button>
          </div>
        `
        : '<p class="empty-note">Kaikki projektin jäsenet ovat jo tässä ryhmässä.</p>';
    }

    document.getElementById('modalHost').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <h3>${g.name}</h3>
          <div>${memberLinesHtml}</div>
          ${addRowHtml}
          <div class="actions">
            <button class="secondary" onclick="closeModal()">Sulje</button>
          </div>
        </div>
      </div>
    `;
  }

  async function callUpdateGroupMembers(groupId, participantId, action) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/update-group-members`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ groupId, participantId, action }),
    });
    return res.json();
  }

  async function removeGroupMember(groupId, participantId) {
    const data = await callUpdateGroupMembers(groupId, participantId, 'remove');
    if (data.error) {
      alert('Virhe: ' + data.error);
      return;
    }
    await loadStatus();
    openGroupDetail(groupId);
  }

  async function addGroupMember(groupId) {
    const select = document.getElementById('addMemberSelect');
    if (!select || !select.value) return;
    const data = await callUpdateGroupMembers(groupId, select.value, 'add');
    if (data.error) {
      alert('Virhe: ' + data.error);
      return;
    }
    await loadStatus();
    openGroupDetail(groupId);
  }

  // ---- Näkyvyysasetukset + kalenterivaltuutuksen hallinta + projektista poistuminen ----

  function isoToDatetimeLocal(iso) {
    return iso.slice(0, 16);
  }

  function datetimeLocalToIso(value) {
    return value + ':00.000Z';
  }

  async function openSettingsModal() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-participant-settings`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();

    if (data.error) {
      alert('Virhe: ' + data.error);
      return;
    }

    settingsState = {
      participantId: data.participantId,
      calendarStatus: data.calendarStatus,
      tokenUpdatedAt: data.tokenUpdatedAt,
      fullyHidden: !!data.fullyHidden,
      windowsByDay: { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] },
      blackouts: [],
    };

    (data.windows || []).forEach((w) => {
      settingsState.windowsByDay[w.weekday].push({ start: w.start_time.slice(0, 5), end: w.end_time.slice(0, 5) });
    });
    (data.blackouts || []).forEach((b) => {
      settingsState.blackouts.push({ startAt: isoToDatetimeLocal(b.start_at), endAt: isoToDatetimeLocal(b.end_at) });
    });

    renderSettingsModal();
  }

  function calendarSectionHtml() {
    const s = settingsState;
    if (s.calendarStatus === 'authorized') {
      const updated = s.tokenUpdatedAt ? new Date(s.tokenUpdatedAt).toLocaleString('fi-FI') : '–';
      return `
        <div class="calendar-section">
          <p class="ok-text">✓ Kalenteri on valtuutettu.</p>
          <p class="meta">Päivitetty viimeksi: ${updated}</p>
          <button class="danger" type="button" onclick="revokeCalendarAuth()">Poista valtuutus</button>
        </div>
      `;
    }
    if (s.calendarStatus === 'expired') {
      return `
        <div class="calendar-section">
          <p class="warn-text">Microsoft-valtuutus vanhentunut. Hae uudestaan.</p>
          <button type="button" onclick="startCalendarAuthForParticipant('${s.participantId}')">Hae uudestaan</button>
        </div>
      `;
    }
    return `
      <div class="calendar-section">
        <p class="empty-note">Kalenteria ei ole vielä valtuutettu.</p>
        <button type="button" onclick="startCalendarAuthForParticipant('${s.participantId}')">Anna lupa nähdä kalenterisi saatavilla/kiireinen ajat</button>
      </div>
    `;
  }

  async function revokeCalendarAuth() {
    if (!confirm('Poistetaanko kalenterivaltuutus? Muut eivät voi enää nähdä aikataulujasi tässä projektissa, ennen kuin annat luvan uudelleen.')) return;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/revoke-calendar-authorization`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();
    if (data.error) { alert('Virhe: ' + data.error); return; }

    closeModal();
    loadStatus();
  }

  async function leaveProjectConfirm() {
    if (!confirm('Haluatko varmasti poistua tästä projektista? Tätä ei voi perua.')) return;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/leave-project`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();
    if (data.error) { alert('Virhe: ' + data.error); return; }

    window.location.href = '/projektit.html';
  }

  function toggleSettingsDay(day, checked) {
    if (checked) {
      if (settingsState.windowsByDay[day].length === 0) {
        settingsState.windowsByDay[day].push({ start: '09:00', end: '17:00' });
      }
    } else {
      settingsState.windowsByDay[day] = [];
    }
    renderSettingsModal();
  }

  function addSettingsRange(day) {
    settingsState.windowsByDay[day].push({ start: '09:00', end: '17:00' });
    renderSettingsModal();
  }

  function removeSettingsRange(day, idx) {
    settingsState.windowsByDay[day].splice(idx, 1);
    renderSettingsModal();
  }

  function updateSettingsRangeField(day, idx, field, value) {
    settingsState.windowsByDay[day][idx][field] = value;
  }

  function addBlackout() {
    settingsState.blackouts.push({ startAt: '', endAt: '' });
    renderSettingsModal();
  }

  function removeBlackout(idx) {
    settingsState.blackouts.splice(idx, 1);
    renderSettingsModal();
  }

  function updateBlackoutField(idx, field, value) {
    settingsState.blackouts[idx][field] = value;
  }

  function renderSettingsModal() {
    let daysHtml = '';
    for (let d = 0; d < 7; d++) {
      const ranges = settingsState.windowsByDay[d];
      const enabled = ranges.length > 0;
      const rangesHtml = ranges.map((r, idx) => `
        <div class="range-row">
          <input type="time" value="${r.start}" onchange="updateSettingsRangeField(${d}, ${idx}, 'start', this.value)" />
          <span>–</span>
          <input type="time" value="${r.end}" onchange="updateSettingsRangeField(${d}, ${idx}, 'end', this.value)" />
          <button type="button" class="remove-x" onclick="removeSettingsRange(${d}, ${idx})">✕</button>
        </div>
      `).join('');

      daysHtml += `
        <div class="day-block">
          <label class="day-toggle">
            <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleSettingsDay(${d}, this.checked)" />
            ${WEEKDAY_LABELS[d]}
          </label>
          ${enabled ? `<div class="ranges">${rangesHtml}<button type="button" class="secondary add-range-btn" onclick="addSettingsRange(${d})">+ Lisää kellonaika</button></div>` : ''}
        </div>
      `;
    }

    const blackoutsHtml = settingsState.blackouts.map((b, idx) => `
      <div class="blackout-row">
        <input type="datetime-local" value="${b.startAt}" onchange="updateBlackoutField(${idx}, 'startAt', this.value)" />
        <span>–</span>
        <input type="datetime-local" value="${b.endAt}" onchange="updateBlackoutField(${idx}, 'endAt', this.value)" />
        <button type="button" class="remove-x" onclick="removeBlackout(${idx})">✕</button>
      </div>
    `).join('') || '<p class="empty-note">Ei rajoitusjaksoja.</p>';

    document.getElementById('modalHost').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal settings-modal">
          <h3>Näkyvyysasetukset</h3>

          ${calendarSectionHtml()}

          <label style="margin-top:0;">Näytä kalenterini muille näinä ajankohtina</label>
          <p class="empty-note" style="margin-top:-2px;">Jos et aktivoi yhtään päivää, kalenterisi näkyy muille aina.</p>
          ${daysHtml}

          <label style="margin-top:16px;">Rajoita kalenterin näkyvyys projektille tiettynä ajankohtana</label>
          <div id="blackoutsList">${blackoutsHtml}</div>
          <button type="button" class="secondary" onclick="addBlackout()">+ Lisää uusi</button>

          <label class="fully-hidden-row">
            <input type="checkbox" ${settingsState.fullyHidden ? 'checked' : ''} onchange="settingsState.fullyHidden = this.checked" />
            Rajoita kalenterini näkyminen projektille
          </label>

          <div class="actions">
            <button class="secondary" onclick="closeModal()">Peruuta</button>
            <button onclick="saveSettingsSubmit()">Tallenna</button>
          </div>

          <div class="danger-zone">
            <button class="danger" type="button" onclick="leaveProjectConfirm()">Poistu projektista</button>
          </div>
        </div>
      </div>
    `;
  }

  async function saveSettingsSubmit() {
    const windows = [];
    for (let d = 0; d < 7; d++) {
      settingsState.windowsByDay[d].forEach((r) => {
        if (r.start && r.end) windows.push({ weekday: d, startTime: r.start + ':00', endTime: r.end + ':00' });
      });
    }

    const blackouts = settingsState.blackouts
      .filter((b) => b.startAt && b.endAt)
      .map((b) => ({ startAt: datetimeLocalToIso(b.startAt), endAt: datetimeLocalToIso(b.endAt) }));

    const res = await fetch(`${SUPABASE_URL}/functions/v1/update-participant-settings`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        projectId: PROJECT_ID,
        fullyHidden: settingsState.fullyHidden,
        windows,
        blackouts,
      }),
    });
    const data = await res.json();

    if (data.error) {
      alert('Virhe: ' + data.error);
      return;
    }

    closeModal();
    loadStatus();
  }

  linkVerticalScroll(document.getElementById('peopleNamesRows'), document.getElementById('peopleTimelineRows'));
  linkVerticalScroll(document.getElementById('ownGroupNames'), document.getElementById('ownGroupTimelines'));
  linkVerticalScroll(document.getElementById('projectGroupNames'), document.getElementById('projectGroupTimelines'));

  attachMasterPaging();

  (async () => {
    const ok = await ensureLoggedIn();
    if (ok) {
      await loadStatus();
      setHomeScroll();
    }
  })();
</script>

</body>
</html>
