  const HOUR_PX = 80;
  const PX_PER_MIN = HOUR_PX / 60;

  function weekdayShortArr() {
    return ['weekday_short_mon','weekday_short_tue','weekday_short_wed','weekday_short_thu','weekday_short_fri','weekday_short_sat','weekday_short_sun'].map((k) => t(k));
  }
  function weekdayFullArr() {
    return ['weekday_full_mon','weekday_full_tue','weekday_full_wed','weekday_full_thu','weekday_full_fri','weekday_full_sat','weekday_full_sun'].map((k) => t(k));
  }
  function monthFullArr() {
    const arr = [];
    for (let i = 1; i <= 12; i++) arr.push(t('month_' + i));
    return arr;
  }

  const CLIENT_ID = "54f922c6-aa24-44b4-9305-f28964c09f96";

  let dayRangeMode = 'full';
  let hideWeekends = false;

  let HOURS_START = 0;
  let HOURS_END = 24;
  let DAY_VISIBLE_PX = 24 * HOUR_PX;

  function computeHoursWindow() {
    if (dayRangeMode === 'business') { HOURS_START = 9; HOURS_END = 17; }
    else { HOURS_START = 0; HOURS_END = 24; }
    DAY_VISIBLE_PX = (HOURS_END - HOURS_START) * HOUR_PX;
  }

  function loadViewPrefsFromStorage() {
    const viewPrefs = JSON.parse(localStorage.getItem('yhteisikkuna_viewPrefs') || '{}');
    dayRangeMode = viewPrefs.dayRangeMode || 'full';
    hideWeekends = !!viewPrefs.hideWeekends;
    computeHoursWindow();
  }
  loadViewPrefsFromStorage();

  function saveViewPrefs() {
    localStorage.setItem('yhteisikkuna_viewPrefs', JSON.stringify({ dayRangeMode, hideWeekends }));
  }

  function setDayRangeMode(mode) {
    dayRangeMode = mode;
    computeHoursWindow();
    saveViewPrefs();
    renderAll();
    setHomeScroll();
  }

  function setHideWeekends(checked) {
    hideWeekends = checked;
    saveViewPrefs();
    renderAll();
    setHomeScroll();
  }

  let currentAccessToken = null;
  let currentUserEmail = null;
  let latestStatus = null;
  let anchorDateStr = null;
  let settingsState = null;

  function toDateStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todayDateStr() {
    return toDateStr(new Date());
  }

  function stepDay(dateStr, direction) {
    const d = new Date(dateStr + 'T00:00:00');
    do {
      d.setDate(d.getDate() + direction);
    } while (hideWeekends && (d.getDay() === 0 || d.getDay() === 6));
    return toDateStr(d);
  }

  function stepDayBy(dateStr, n) {
    let c = dateStr;
    const dir = n >= 0 ? 1 : -1;
    for (let i = 0; i < Math.abs(n); i++) c = stepDay(c, dir);
    return c;
  }
function bufferDates(anchor) {
    anchor = anchor || anchorDateStr;
    const prev = stepDay(anchor, -1);
    const arr = [prev, anchor];
    let c = anchor;
    for (let i = 0; i < 3; i++) {
      c = stepDay(c, 1);
      arr.push(c);
    }
    return arr;
  }

  function itemDateStr(item) {
    const d = new Date(item.start.dateTime + 'Z');
    return toDateStr(d);
  }

  function rulerHtml(anchor) {
    const dates = bufferDates(anchor);
    const wdShort = weekdayShortArr();
    let html = '';
    dates.forEach((dateStr, i) => {
      const d = new Date(dateStr + 'T00:00:00');
      const label = wdShort[(d.getDay() + 6) % 7] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.';
      html += `<div class="day-label" style="left:${i * DAY_VISIBLE_PX}px; width:${DAY_VISIBLE_PX}px;">${label}</div>`;
      for (let h = HOURS_START; h <= HOURS_END; h++) {
        const x = i * DAY_VISIBLE_PX + (h - HOURS_START) * HOUR_PX;
        html += `<div class="hour-label" style="left:${x}px;">${h}</div>`;
      }
    });
    return html;
  }

  function hourGridLinesHtml() {
    let html = '';
    for (let i = 0; i < BUFFER_DAYS; i++) {
      for (let h = HOURS_START; h <= HOURS_END; h++) {
        const x = i * DAY_VISIBLE_PX + (h - HOURS_START) * HOUR_PX;
        html += `<div class="hour-grid-line" style="left:${x}px;"></div>`;
      }
    }
    return html;
  }

  function dayBackgroundsHtml() {
    let html = '';
    for (let i = 0; i < BUFFER_DAYS; i++) {
      html += `<div class="day-bg" style="left:${i * DAY_VISIBLE_PX + 1}px; width:${DAY_VISIBLE_PX - 2}px;"></div>`;
    }
    return html;
  }

  function busyBlocksHtml(items, anchor) {
    const dates = bufferDates(anchor);
    const winStart = HOURS_START * 60;
    const winEnd = HOURS_END * 60;
    let html = '';
    (items || []).forEach((item) => {
      if (item.status !== 'busy') return;
      const dateStr = itemDateStr(item);
      const dayIdx = dates.indexOf(dateStr);
      if (dayIdx === -1) return;

      const start = new Date(item.start.dateTime + 'Z');
      const end = new Date(item.end.dateTime + 'Z');
      let startMin = start.getHours() * 60 + start.getMinutes();
      let endMin = end.getHours() * 60 + end.getMinutes();
      if (endMin <= startMin) endMin = 1440;

      if (endMin <= winStart || startMin >= winEnd) return;
      startMin = Math.max(startMin, winStart);
      endMin = Math.min(endMin, winEnd);

      const leftPx = dayIdx * DAY_VISIBLE_PX + (startMin - winStart) * PX_PER_MIN;
      const widthPx = (endMin - startMin) * PX_PER_MIN;
      const locale = getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI';
      const startLabel = start.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
      const endLabel = end.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
      html += `<div class="busy-block" style="left:${leftPx}px; width:${widthPx}px;" title="${t('legend_busy')} ${startLabel}–${endLabel}"></div>`;
    });
    return html;
  }

    function restrictedBlocksHtml(ranges, anchor) {
    const dates = bufferDates(anchor);
    const winStart = HOURS_START * 60;
    const winEnd = HOURS_END * 60;
    let html = '';
    (ranges || []).forEach((r) => {
      const dateStr = itemDateStr({ start: { dateTime: r.start } });
      const dayIdx = dates.indexOf(dateStr);
      if (dayIdx === -1) return;
      const start = new Date(r.start + 'Z');
      const end = new Date(r.end + 'Z');
      let startMin = start.getHours() * 60 + start.getMinutes();
      let endMin = end.getHours() * 60 + end.getMinutes();
      if (endMin <= startMin) endMin = 1440;
      if (endMin <= winStart || startMin >= winEnd) return;
      startMin = Math.max(startMin, winStart);
      endMin = Math.min(endMin, winEnd);
      const leftPx = dayIdx * DAY_VISIBLE_PX + (startMin - winStart) * PX_PER_MIN;
      const widthPx = (endMin - startMin) * PX_PER_MIN;
      html += `<div class="restricted-block" style="left:${leftPx}px; width:${widthPx}px;"></div>`;
    });
    return html;
  }

  function nowLineHtml(anchor) {
    const dates = bufferDates(anchor);
    const todayIdx = dates.indexOf(todayDateStr());
    if (todayIdx === -1) return '';
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    if (nowMin < HOURS_START * 60 || nowMin >= HOURS_END * 60) return '';
    const leftPx = todayIdx * DAY_VISIBLE_PX + (nowMin - HOURS_START * 60) * PX_PER_MIN;
    return `<div class="now-line" style="left:${leftPx}px;"></div>`;
  }

    async function startCalendarAuthForParticipant(participantId, wantsWrite) {
    const { data: { session } } = await client.auth.getSession();
    const provider = session?.user?.app_metadata?.provider;

    if (provider === 'google') {
      const authUrl = new URL('https://accounts.google.com/o/oauth2/v2/auth');
      authUrl.searchParams.set('client_id', GOOGLE_CLIENT_ID);
      authUrl.searchParams.set('response_type', 'code');
      authUrl.searchParams.set('redirect_uri', GOOGLE_CALENDAR_REDIRECT_URI);
      authUrl.searchParams.set('scope', 'https://www.googleapis.com/auth/calendar.readonly');
      authUrl.searchParams.set('access_type', 'offline');
      authUrl.searchParams.set('prompt', 'consent');
      authUrl.searchParams.set('state', participantId);
      window.location.href = authUrl.toString();
      return;
    }

    // Jos kirjoitusoikeus on jo annettu, säilytetään se myös silloin kun
    // valtuutus uusitaan lukuoikeuden napista — muuten oikeus katoaisi hiljaisesti.
    const write = !!wantsWrite;
    const authUrl = new URL('https://login.microsoftonline.com/common/oauth2/v2.0/authorize');
    authUrl.searchParams.set('client_id', CLIENT_ID);
    authUrl.searchParams.set('response_type', 'code');
    authUrl.searchParams.set('redirect_uri', CALENDAR_REDIRECT_URI);
    authUrl.searchParams.set('response_mode', 'query');
    authUrl.searchParams.set('scope', write
      ? 'User.Read Calendars.Read Calendars.ReadWrite offline_access'
      : 'User.Read Calendars.Read offline_access');
       // Kolmas osa kertoo auth-callbackille että paluu tapahtuu tälle projektisivulle.
      authUrl.searchParams.set('state', `${participantId}|${write ? 'rw' : ''}|p:${PROJECT_ID}`);
    window.location.href = authUrl.toString();
  }

  function resolvePersonBusy(id) {
    const p = latestStatus.participants.find((x) => x.id === id);
    if (!p || !p.scheduleItems) return [];
    return p.scheduleItems
      .filter((i) => i.status === 'busy')
      .map((i) => ({ startMs: new Date(i.start.dateTime + 'Z').getTime(), endMs: new Date(i.end.dateTime + 'Z').getTime() }));
  }

  function resolveGroupBusy(id) {
    const g = (latestStatus.groups || []).find((x) => x.id === id);
    if (!g) return [];
    return groupMergedItems(g)
      .filter((i) => i.status === 'busy')
      .map((i) => ({ startMs: new Date(i.start.dateTime + 'Z').getTime(), endMs: new Date(i.end.dateTime + 'Z').getTime() }));
  }

  function overlapsMs(s1, e1, s2, e2) {
    return s1 < e2 && s2 < e1;
  }

  function findAvailableSlots(opts) {
    const { durationMinutes, requiredBusy, optionalBusyLists, searchStart, searchEnd, preferWindows } = opts;
    const durationMs = durationMinutes * 60000;
    const stepMs = 15 * 60000;
    const dayStartHour = 8;
    const dayEndHour = 18;

    let cursor = new Date(searchStart);
    cursor.setSeconds(0, 0);
    const rem = cursor.getMinutes() % 15;
    if (rem !== 0) cursor.setMinutes(cursor.getMinutes() + (15 - rem));

    const candidates = [];
    let guard = 0;
    while (cursor.getTime() + durationMs <= searchEnd.getTime() && guard < 20000) {
      guard++;
      const day = cursor.getDay();
      const hour = cursor.getHours() + cursor.getMinutes() / 60;
      const endHourFrac = hour + durationMinutes / 60;
      const withinDay = day !== 0 && day !== 6 && hour >= dayStartHour && endHourFrac <= dayEndHour;

      if (withinDay) {
        const slotStart = cursor.getTime();
        const slotEnd = slotStart + durationMs;
        const conflictsRequired = requiredBusy.some((b) => overlapsMs(slotStart, slotEnd, b.startMs, b.endMs));

        if (!conflictsRequired) {
          let optionalConflicts = 0;
          optionalBusyLists.forEach((list) => {
            if (list.some((b) => overlapsMs(slotStart, slotEnd, b.startMs, b.endMs))) optionalConflicts++;
          });
          const prefersMatch = preferWindows.length === 0 ? true : preferWindows.some((w) => hour >= w.start && hour < w.end);
          candidates.push({ startMs: slotStart, endMs: slotEnd, optionalConflicts, prefersMatch });
        }
      }
      cursor = new Date(cursor.getTime() + stepMs);
    }

    candidates.sort((a, b) => {
      if (a.prefersMatch !== b.prefersMatch) return a.prefersMatch ? -1 : 1;
      if (a.optionalConflicts !== b.optionalConflicts) return a.optionalConflicts - b.optionalConflicts;
      return a.startMs - b.startMs;
    });

    const chosen = [];
    for (const c of candidates) {
      if (chosen.some((ch) => overlapsMs(c.startMs, c.endMs, ch.startMs, ch.endMs))) continue;
      chosen.push(c);
      if (chosen.length >= 5) break;
    }
    return chosen;
  }

  function searchEventSlots() {
    const s = eventModalState;
    const requiredIds = { people: [], groups: [] };
    const optionalIds = { people: [], groups: [] };

    Object.entries(s.peopleRoles).forEach(([id, role]) => (role === 'required' ? requiredIds.people : optionalIds.people).push(id));
    Object.entries(s.groupRoles).forEach(([id, role]) => (role === 'required' ? requiredIds.groups : optionalIds.groups).push(id));

    if (requiredIds.people.length + requiredIds.groups.length + optionalIds.people.length + optionalIds.groups.length === 0) {
      alert(t('alert_select_attendee'));
      return;
    }

    const requiredBusy = [
      ...requiredIds.people.flatMap(resolvePersonBusy),
      ...requiredIds.groups.flatMap(resolveGroupBusy),
    ];
    const optionalBusyLists = [
      ...optionalIds.people.map(resolvePersonBusy),
      ...optionalIds.groups.map(resolveGroupBusy),
    ];

    const now = new Date();
    const searchStart = s.rangeFrom ? new Date(s.rangeFrom) : now;
    const searchEnd = s.rangeTo ? new Date(s.rangeTo) : new Date(now.getTime() + 90 * 24 * 60 * 60 * 1000);

    const preferWindows = [];
    if (s.preferMorning) preferWindows.push({ start: 8, end: 11 });
    if (s.preferMidday) preferWindows.push({ start: 11, end: 14 });
    if (s.preferAfternoon) preferWindows.push({ start: 14, end: 17 });

    const results = findAvailableSlots({
      durationMinutes: Number(s.duration) || 30,
      requiredBusy,
      optionalBusyLists,
      searchStart,
      searchEnd,
      preferWindows,
    });

    if (results.length === 0) {
      alert(t('alert_no_slots_found'));
      return;
    }

    s.results = results;
    s.selectedResultIdx = 0;
    s.selStart = results[0].startMs;
    s.selEnd = results[0].endMs;
    s.calAnchor = toDateStr(new Date(results[0].startMs));
    renderEventResultsStep();
  }

  function formatSlotLabel(slot) {
    const start = new Date(slot.startMs);

    const dateStr = start.getDate() + '.' + (start.getMonth() + 1) + '.';
    const locale = getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI';
    const startTime = start.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
    const endTime = end.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
    return `${wd} ${dateStr} ${startTime}–${endTime}`;
  }

  function pxForTimestamp(ms, anchor) {
    const d = new Date(ms);
    const dayIdx = bufferDates(anchor).indexOf(toDateStr(d));
    if (dayIdx === -1) return null;
    const minutes = d.getHours() * 60 + d.getMinutes();
    return dayIdx * DAY_VISIBLE_PX + (minutes - HOURS_START * 60) * PX_PER_MIN;
  }

    const left = pxForTimestamp(s.selStart, s.calAnchor);
    const right = pxForTimestamp(s.selEnd, s.calAnchor);
    if (left === null || right === null) return '';

      i.status === 'busy' && overlapsMs(s.selStart, s.selEnd, new Date(i.start.dateTime + 'Z').getTime(), new Date(i.end.dateTime + 'Z').getTime())
    );
    return `<div class="sel-overlay ${conflict ? 'sel-overlay-conflict' : 'sel-overlay-free'}" style="left:${left}px; width:${right - left}px;"></div>`;
  }

  function formatDatetimeLocal(ms) {
    const d = new Date(ms);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
      + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

    eventModalState.selEnd = newEnd;

  function timestampForClickX(xOffset, anchor) {
    const dayIdx = Math.floor(xOffset / DAY_VISIBLE_PX);
    const dates = bufferDates(anchor);
    const dateStr = dates[dayIdx];
    if (!dateStr) return null;
    const withinDayPx = xOffset - dayIdx * DAY_VISIBLE_PX;
    const minutesFromWindowStart = withinDayPx / PX_PER_MIN;
    const totalMinutes = HOURS_START * 60 + minutesFromWindowStart;
    const snappedMinutes = Math.round(totalMinutes / 15) * 15;
    const d = new Date(dateStr + 'T00:00:00');
    d.setMinutes(snappedMinutes);
    return d.getTime();

    eventModalState.selEnd = clicked + duration;

  function attachSelectionDrag() {
    document.querySelectorAll('.sel-overlay').forEach((el) => {
      el.addEventListener('click', (e) => e.stopPropagation());

      el.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        const rect = el.getBoundingClientRect();
        const leftEdge = e.clientX - rect.left < 10;
        const rightEdge = rect.right - e.clientX < 10;
        e.preventDefault();

        const startX = e.clientX;
        const originalStart = eventModalState.selStart;
        const originalEnd = eventModalState.selEnd;
        const duration = originalEnd - originalStart;

        function snap(ms) {
          return Math.round(ms / (15 * 60000)) * (15 * 60000);
        }

        function onMove(ev) {
          const deltaMs = ((ev.clientX - startX) / PX_PER_MIN) * 60000;

          if (rightEdge) {
            let newEnd = snap(originalEnd + deltaMs);
            if (newEnd <= eventModalState.selStart + 15 * 60000) newEnd = eventModalState.selStart + 15 * 60000;
            eventModalState.selEnd = newEnd;
          } else if (leftEdge) {
            let newStart = snap(originalStart + deltaMs);
            if (newStart >= eventModalState.selEnd - 15 * 60000) newStart = eventModalState.selEnd - 15 * 60000;
            eventModalState.selStart = newStart;
          } else {
            const newStart = snap(originalStart + deltaMs);
            eventModalState.selStart = newStart;
            eventModalState.selEnd = newStart + duration;
          }

          const newAnchor = toDateStr(new Date(eventModalState.selStart));
          if (newAnchor !== eventModalState.calAnchor) {
            eventModalState.calAnchor = newAnchor;
          }

          updateSelectionOverlaysInPlace();
          updateSelectedTimeInputsInPlace();
        }

        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          eventModalState.calAnchor = toDateStr(new Date(eventModalState.selStart));
          renderEventResultsStep();
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      el.addEventListener('mousemove', (e) => {
        const rect = el.getBoundingClientRect();
        if (rect.right - e.clientX < 10 || e.clientX - rect.left < 10) {
          el.style.cursor = 'ew-resize';

          el.style.cursor = 'grab';
        }

    });
  }

  // Purkaa ryhmät jäseniksi, poistaa duplikaatit (pakollinen voittaa),
  // jättää järjestäjän itsensä pois ja merkitsee konfliktit.
  function buildInviteAttendees() {
    const s = eventModalState;
    const roleById = {};

    function assign(id, role) {
      if (roleById[id] === 'required') return;
      if (role === 'required' || !roleById[id]) roleById[id] = role;
    }

    Object.entries(s.peopleRoles).forEach(([id, role]) => assign(id, role));
    Object.entries(s.groupRoles).forEach(([gid, role]) => {
      const g = (latestStatus.groups || []).find((x) => x.id === gid);
      if (!g) return;
      (g.members || []).forEach((m) => assign(m.participantId, role));
    });

    const slot = s.results[s.selectedResultIdx];

    const list = Object.entries(roleById).map(([id, role]) => {
      const p = latestStatus.participants.find((x) => x.id === id);
      if (!p) return null;
      if (p.email.toLowerCase() === currentUserEmail) return null;

      const hasCalendar = p.status === 'authorized' && !!p.scheduleItems;
      const conflict = hasCalendar &&
        resolvePersonBusy(id).some((b) => overlapsMs(slot.startMs, slot.endMs, b.startMs, b.endMs));

            return {
        id,
        role,
        email: p.email,
        name: nameLabelFor(p),
        hasName: !!(p.firstName || p.lastName),
        noCalendar: !hasCalendar,
        conflict,
      };
    }).filter(Boolean);

    list.sort((a, b) => a.name.localeCompare(b.name, 'fi'));

    return {
      required: list.filter((x) => x.role === 'required'),
      optional: list.filter((x) => x.role === 'optional'),
    };
  }

  // "Antti Heinonen <antti@firma.fi>; Heikki Jou <heikki@jou.fi>"
  function attendeeAddressString(list) {
    return list
      .map((a) => (a.hasName ? `${a.name} <${a.email}>` : a.email))
      .join('; ');
  }

  function attendeeChipsHtml(list) {
    if (list.length === 0) return `<p class="empty-note">${t('invite_nobody')}</p>`;
    return list.map((a) => {
      let cls = 'attendee-chip';
      let tip = '';
      if (a.conflict) { cls += ' conflict'; tip = t('invite_flag_conflict'); }
      else if (a.noCalendar) { cls += ' nocal'; tip = t('invite_flag_nocal'); }
      return `<span class="${cls}" title="${tip}">${a.name}</span>`;
    }).join('');
  }

  function copyInviteField(fieldId) {
    const el = document.getElementById(fieldId);
    if (!el) return;
    el.select();
    const done = () => {
      const btn = document.getElementById(fieldId + 'Btn');
      if (!btn) return;
      const prev = btn.textContent;
      btn.textContent = t('copied_check');
      setTimeout(() => { btn.textContent = prev; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(el.value).then(done).catch(() => document.execCommand('copy') && done());
    } else {
      document.execCommand('copy');
      done();
    }
  }

    function localDateTimeString(date) {
    const p = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}` +
           `T${p(date.getHours())}:${p(date.getMinutes())}:00`;

  async function sendInvite() {
    const s = eventModalState;
    const btn = document.getElementById('sendInviteBtn');
    if (btn) { btn.disabled = true; btn.textContent = t('sending_label'); }

    const { required, optional } = buildInviteAttendees();
    const slot = s.results[s.selectedResultIdx];

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/create-event`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({
          projectId: PROJECT_ID,
          requiredIds: required.map((a) => a.id),
          optionalIds: optional.map((a) => a.id),
          subject: s.inviteTitle,
          body: s.inviteBody,
          start: localDateTimeString(new Date(slot.startMs)),
          end: localDateTimeString(new Date(slot.endMs)),
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Helsinki',
        }),
      });
      const data = await res.json();

      if (data.error) {
        alert(t('invite_send_failed') + ': ' + data.error);
        if (btn) { btn.disabled = false; btn.textContent = t('send_invites_btn'); }
        return;
      }

      renderInviteSentStep(data);
    } catch (err) {
      alert(t('invite_send_failed') + ': ' + err.message);
      if (btn) { btn.disabled = false; btn.textContent = t('send_invites_btn'); }
    }
  }

          <h3>${t('invite_sent_heading')}</h3>
          <p class="sub">${t('invite_sent_body', { count: data.attendeeCount })}</p>
          ${teamsHtml}
          ${openHtml}
          <div class="actions">
            <button onclick="closeModal()">${t('close')}</button>
          </div>
        </div>
      </div>
    `;
  }


  
function isoToDatetimeLocal(iso) {
    return iso.slice(0, 16);
  }

  function datetimeLocalToIso(value) {
    return value + ':00.000Z';
  }

async function openSettingsModal() {
    settingsActiveTab = 'own';

    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-participant-settings`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();

    if (data.error) {
      alert(t('error_prefix') + ': ' + data.error);
      return;
    }

    settingsState = {
      participantId: data.participantId,
        calendarStatus: data.calendarStatus,
      calendarWrite: !!data.calendarWrite,
      tokenUpdatedAt: data.tokenUpdatedAt,
      fullyHidden: !!data.fullyHidden,
      windowsByDay: { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] },
      blackouts: [],
    };

    (data.windows || []).forEach((w) => {
      settingsState.windowsByDay[w.weekday].push({ start: w.start_time.slice(0, 5), end: w.end_time.slice(0, 5) });
    });
    (data.blackouts || []).forEach((b) => {
      settingsState.blackouts.push({ startAt: isoToDatetimeLocal(b.start_at), endAt: isoToDatetimeLocal(b.end_at) });
    });

    renderSettingsModal();
  }

  function viewPrefsSectionHtml() {
    return `
      <div class="view-prefs-section">
        <label style="margin-top:0;">${t('view_settings_label')}</label>
        <div class="radio-row">
          <label><input type="radio" name="dayRangeMode" value="full" ${dayRangeMode === 'full' ? 'checked' : ''} onchange="setDayRangeMode('full')" /> ${t('full_day_option')}</label>
          <label><input type="radio" name="dayRangeMode" value="business" ${dayRangeMode === 'business' ? 'checked' : ''} onchange="setDayRangeMode('business')" /> ${t('business_hours_option')}</label>
        </div>
        <div class="check-row">
          <input type="checkbox" id="hideWeekendsCheck" ${hideWeekends ? 'checked' : ''} onchange="setHideWeekends(this.checked)" />
          <label style="margin:0;" for="hideWeekendsCheck">${t('hide_weekends_label')}</label>
        </div>
      </div>
    `;
  }

  function calendarSectionHtml() {
    const s = settingsState;
    const locale = getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI';
    if (s.calendarStatus === 'authorized') {
      const updated = s.tokenUpdatedAt ? new Date(s.tokenUpdatedAt).toLocaleString(locale) : '–';
      return `
        <div class="calendar-section">
          <p class="ok-text">${t('calendar_authorized_ok')}</p>
          <p class="meta">${t('last_updated_label')}: ${updated}</p>
          <button class="danger" type="button" onclick="revokeCalendarAuth()">${t('revoke_auth_btn')}</button>
        </div>
      `;
    }
    if (s.calendarStatus === 'expired') {
      return `
        <div class="calendar-section">
          <p class="warn-text">${t('calendar_expired_warn')}</p>
          <button type="button" onclick="startCalendarAuthForParticipant('${s.participantId}', ${s.calendarWrite})">${t('retry_auth_btn')}</button>
        </div>
      `;
    }
    return `
      <div class="calendar-section">
        <p class="empty-note">${t('calendar_not_authorized')}</p>
        <button type="button" onclick="startCalendarAuthForParticipant('${s.participantId}', ${s.calendarWrite})">${t('grant_calendar_access')}</button>
      </div>
    `;
  }

  async function revokeCalendarAuth() {
    if (!confirm(t('confirm_revoke_auth'))) return;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/revoke-calendar-authorization`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    closeModal();
    loadStatus();
  }


    function writeAccessSectionHtml() {
    if (currentAuthProvider === 'google') return '';
    const s = settingsState;
    if (s.calendarWrite) {
      return `
        <div class="calendar-section" style="margin-top:18px;">
          <label style="margin-top:0; color:#161B22; font-weight:600;">${t('write_section_title')}</label>
          <p class="ok-text">${t('write_granted_ok')}</p>
        </div>
      `;
    }
    return `
      <div class="calendar-section" style="margin-top:18px;">
        <label style="margin-top:0; color:#161B22; font-weight:600;">${t('write_section_title')}</label>
        <p class="empty-note">${t('write_section_explain')}</p>
        <button type="button" onclick="startWriteAuth()">${t('grant_write_btn')}</button>
      </div>
    `;
  }

  function startWriteAuth() {
    if (!confirm(t('confirm_write_auth'))) return;
    startCalendarAuthForParticipant(settingsState.participantId, true);
  }

  async function leaveProjectConfirm() {
    if (!confirm(t('confirm_leave_project'))) return;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/leave-project`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    window.location.href = '/projektit.html';
  }

  function toggleSettingsDay(day, checked) {
    if (checked) {
      if (settingsState.windowsByDay[day].length === 0) {
        settingsState.windowsByDay[day].push({ start: '09:00', end: '17:00' });
      }
    } else {
      settingsState.windowsByDay[day] = [];
    }
    renderSettingsModal();
  }

  function addSettingsRange(day) {
    settingsState.windowsByDay[day].push({ start: '09:00', end: '17:00' });
    renderSettingsModal();
  }

  function removeSettingsRange(day, idx) {
    settingsState.windowsByDay[day].splice(idx, 1);
    renderSettingsModal();
  }

  function updateSettingsRangeField(day, idx, field, value) {
    settingsState.windowsByDay[day][idx][field] = value;
  }

  function addBlackout() {
    settingsState.blackouts.push({ startAt: '', endAt: '' });
    renderSettingsModal();
  }

  function removeBlackout(idx) {
    settingsState.blackouts.splice(idx, 1);
    renderSettingsModal();
  }

  function updateBlackoutField(idx, field, value) {
    settingsState.blackouts[idx][field] = value;
  }

   function switchSettingsTab(tab) {
    settingsActiveTab = tab;
    renderSettingsModal();
  }

  function renderSettingsModal() {
    const admin = isAdminForProject(latestStatus);

    const tabsHtml = admin ? `
      <div class="settings-tabs">
        <button type="button" class="settings-tab-btn ${settingsActiveTab === 'own' ? 'active' : ''}" onclick="switchSettingsTab('own')">${t('settings_tab_own')}</button>
        <button type="button" class="settings-tab-btn ${settingsActiveTab === 'project' ? 'active' : ''}" onclick="switchSettingsTab('project')">${t('settings_tab_project')}</button>
      </div>
    ` : '';

    const bodyHtml = (!admin || settingsActiveTab === 'own') ? renderOwnSettingsTabHtml() : renderProjectSettingsTabHtml();

    document.getElementById('modalHost').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal settings-modal">
          <h3>${t('modal_settings')}</h3>
          ${tabsHtml}
          ${bodyHtml}
          <div class="actions">
            <button class="secondary" onclick="closeModal()">${t('close')}</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderOwnSettingsTabHtml() {
    let daysHtml = '';
    const wdShort = weekdayShortArr();
    for (let d = 0; d < 7; d++) {
      const ranges = settingsState.windowsByDay[d];
      const enabled = ranges.length > 0;
      const rangesHtml = ranges.map((r, idx) => `
        <div class="range-row">
          <input type="time" value="${r.start}" onchange="updateSettingsRangeField(${d}, ${idx}, 'start', this.value)" />
          <span>–</span>
          <input type="time" value="${r.end}" onchange="updateSettingsRangeField(${d}, ${idx}, 'end', this.value)" />
          <button type="button" class="remove-x" onclick="removeSettingsRange(${d}, ${idx})">✕</button>
        </div>
      `).join('');

      daysHtml += `
        <div class="day-block">
          <label class="day-toggle">
            <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleSettingsDay(${d}, this.checked)" />
            ${wdShort[d]}
          </label>
          ${enabled ? `<div class="ranges">${rangesHtml}<button type="button" class="secondary add-range-btn" onclick="addSettingsRange(${d})">${t('add_time_range')}</button></div>` : ''}
        </div>
      `;
    }

    const blackoutsHtml = settingsState.blackouts.map((b, idx) => `
      <div class="blackout-row">
        <input type="datetime-local" value="${b.startAt}" onchange="updateBlackoutField(${idx}, 'startAt', this.value)" />
        <span>–</span>
        <input type="datetime-local" value="${b.endAt}" onchange="updateBlackoutField(${idx}, 'endAt', this.value)" />
        <button type="button" class="remove-x" onclick="removeBlackout(${idx})">✕</button>
      </div>
    `).join('') || `<p class="empty-note">${t('no_blackouts')}</p>`;

    return `
      ${viewPrefsSectionHtml()}
      ${calendarSectionHtml()}

      <label style="margin-top:0;">${t('show_calendar_to_others')}</label>
      <p class="empty-note" style="margin-top:-2px;">${t('show_calendar_note')}</p>
      ${daysHtml}

      <label style="margin-top:16px;">${t('restrict_visibility_label')}</label>
      <div id="blackoutsList">${blackoutsHtml}</div>
      <button type="button" class="secondary" onclick="addBlackout()">${t('add_new_btn')}</button>

      <label class="fully-hidden-row">
        <input type="checkbox" ${settingsState.fullyHidden ? 'checked' : ''} onchange="settingsState.fullyHidden = this.checked" />
        ${t('hide_calendar_fully')}
      </label>

      <div class="actions">
        <button onclick="saveSettingsSubmit()">${t('save_btn')}</button>
      </div>

      <div class="danger-zone">
        <button class="danger" type="button" onclick="leaveProjectConfirm()">${t('leave_project_btn')}</button>
      </div>
    `;
  }

  function renderProjectSettingsTabHtml() {
    const membersHtml = latestStatus.participants.map((p) => `
      <div class="member-manage-row">
        <span class="mm-name">${nameLabelFor(p)}</span>
        <select onchange="changeParticipantRole('${p.id}', this.value)">
          <option value="guest" ${p.role === 'guest' ? 'selected' : ''}>${t('role_guest')}</option>
          <option value="admin" ${p.role === 'admin' ? 'selected' : ''}>${t('role_admin')}</option>
        </select>
        <button type="button" class="danger" style="padding:5px 10px; font-size:12px;" onclick="removeParticipantFromProject('${p.id}','${nameLabelFor(p).replace(/'/g, "\\'")}')">${t('remove_participant_btn')}</button>
      </div>
    `).join('');

    return `
      <label style="margin-top:0;">${t('project_name_label')}</label>
      <input type="text" id="projectNameEditInput" value="${latestStatus.project.name}" />
      <div class="actions" style="margin-top:8px;">
        <button onclick="saveProjectName()">${t('save_btn')}</button>
      </div>

      <label style="margin-top:20px;">${t('manage_members_heading')}</label>
      <div>${membersHtml}</div>
    `;
  }

  async function saveProjectName() {
    const name = document.getElementById('projectNameEditInput').value.trim();
    if (!name) return;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/update-project`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID, name }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    await loadStatus();
    alert(t('project_name_saved'));
  }

  async function changeParticipantRole(participantId, role) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/update-participant-role`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID, participantId, role }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); }

    await loadStatus();
    renderSettingsModal();
  }

  async function removeParticipantFromProject(participantId, name) {
    if (!confirm(t('confirm_remove_participant', { name }))) return;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/remove-participant-from-project`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: PROJECT_ID, participantId }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    await loadStatus();
    renderSettingsModal();
  }

    

  async function saveSettingsSubmit() {
    const windows = [];
    for (let d = 0; d < 7; d++) {
      settingsState.windowsByDay[d].forEach((r) => {
        if (r.start && r.end) windows.push({ weekday: d, startTime: r.start + ':00', endTime: r.end + ':00' });
      });
    }

    const blackouts = settingsState.blackouts
      .filter((b) => b.startAt && b.endAt)
      .map((b) => ({ startAt: datetimeLocalToIso(b.startAt), endAt: datetimeLocalToIso(b.endAt) }));

    const res = await fetch(`${SUPABASE_URL}/functions/v1/update-participant-settings`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        projectId: PROJECT_ID,
        fullyHidden: settingsState.fullyHidden,
        windows,
        blackouts,
      }),
    });
    const data = await res.json();

    if (data.error) {
      alert(t('error_prefix') + ': ' + data.error);
      return;
    }

    closeModal();
    loadStatus();
  }

  attachMasterPaging();

  (async () => {
    const ok = await ensureLoggedIn();
    if (ok) {
      await loadMyProfileAndTranslations();
      await loadStatus();
      setHomeScroll();
      showAuthReturnBanner();
    }
  })();
</script>

</body>
</html>
