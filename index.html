<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yhteisikkuna — Microsoft-kalenteritesti</title>
<style>
  body { font-family: -apple-system, Segoe UI, Inter, sans-serif; background: #EDF0F3; color: #161B22; max-width: 640px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #586174; font-size: 14px; margin-top: 0; }
  button { background: #2A4B7C; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1D3559; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin: 16px 0; font-size: 13px; color: #586174; }
  #status.error { color: #C0453A; }
  .card { background: #fff; border: 1px solid #DBDFE5; border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; }
  .card .status-busy { color: #C0453A; font-weight: 600; }
  .card .status-free { color: #2F8C5E; font-weight: 600; }
  code { background: #E7EDF5; padding: 2px 6px; border-radius: 4px; font-size: 12.5px; }
</style>
</head>
<body>

<h1>Microsoft-kalenteritesti</h1>
<p class="sub">Kirjaudu omalla Microsoft-tunnuksellasi ja hae oikeat vapaa/varattu-tiedot Graph-rajapinnasta.</p>

<button id="loginBtn">Kirjaudu Microsoft-tilillä</button>
<div id="status"></div>
<div id="results"></div>

<!-- ================================================================
     VÄLIAIKAINEN DEBUG-LOHKO — poista tämä ennen kuin viet sivun
     kenenkään muun nähtäväksi tai tuotantoon. Näyttää Graphin täysin
     raa'an, suodattamattoman vastauksen (mm. subject/location/isPrivate),
     jotta voit testata esim. private-merkinnän vaikutusta.
     ================================================================ -->
<details style="margin-top: 32px; border-top: 1px solid #DBDFE5; padding-top: 16px;">
  <summary style="cursor: pointer; font-size: 13px; color: #586174;">🔧 Debug: raaka Graph-vastaus (suodattamaton)</summary>
  <pre id="debugRaw" style="white-space: pre-wrap; word-break: break-word; font-size: 12px; background: #161B22; color: #c9d1d9; padding: 12px; border-radius: 8px; margin-top: 8px; max-height: 400px; overflow: auto;"></pre>
</details>

<!-- MSAL.js kirjasto suoraan Microsoftin omalta CDN:ltä, ei vaadi asennuksia -->
<script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>

<script>
  // ---------------------------------------------------------------
  // TÄHÄN OMA CLIENT ID Azure-sovellusrekisteröinnistä
  // (Entra ID -> App registrations -> [sovelluksesi] -> Overview -> Application (client) ID)
  // Käytä samaa arvoa jota olet jo käyttänyt aiemmassa toimivassa versiossa.
  // ---------------------------------------------------------------
  const CLIENT_ID = "54f922c6-aa24-44b4-9305-f28964c09f96";

  const msalConfig = {
    auth: {
      clientId: CLIENT_ID,
      // "common" = sekä personal-tilit (Outlook.com) että työ/koulu-tunnukset
      // mistä tahansa organisaatiosta.
      authority: "https://login.microsoftonline.com/common",
      // Tämän pitää olla TÄSMÄLLEEN sama osoite kuin Azuressa rekisteröity
      // SPA-tyyppinen redirect URI (kauttaviiva lopussa mukaan lukien).
      redirectUri: window.location.origin + "/",
    },
  };

  const msalInstance = new msal.PublicClientApplication(msalConfig);

  // Pyydetään Calendars.Read suoraan alusta asti. Calendars.ReadBasic olisi
  // kapeampi oikeus, mutta osoittautui epäluotettavaksi getSchedule-kutsun
  // kanssa (dokumentoitu epäjohdonmukaisuus), ja korotuslogiikka aiheutti
  // selaimen popup-eston koska toinen popup avautuisi vasta verkkokutsun
  // jälkeen. Suora, yksinkertainen pyyntö on siksi luotettavampi valinta.
  const loginRequest = { scopes: ["Calendars.ReadBasic"] };

  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const loginBtn = document.getElementById("loginBtn");

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  loginBtn.addEventListener("click", async () => {
    loginBtn.disabled = true;
    setStatus("Avataan Microsoftin kirjautumisikkuna…");
    try {
      const loginResponse = await msalInstance.loginPopup(loginRequest);
      setStatus("Kirjauduttu sisään: " + loginResponse.account.username);
      await fetchFreeBusy(loginResponse.accessToken, loginResponse.account.username);
    } catch (err) {
      console.error(err);
      setStatus("Kirjautuminen epäonnistui: " + (err.errorMessage || err.message), true);
    } finally {
      loginBtn.disabled = false;
    }
  });

  // ---------------------------------------------------------------
  // Tietoturvasuodatus: otetaan Graphin vastauksesta tarkalleen vain
  // status/start/end. Vaikka Graph joskus palauttaisi myös subject- ja
  // location-kentät (mikä on dokumentoidusti mahdollista Calendars.Read
  // -oikeudella riippuen kohteen kalenteriasetuksista), niitä ei koskaan
  // päästetä tämän funktion läpi eteenpäin tallennukseen tai näyttöön.
  // ---------------------------------------------------------------
  function sanitizeScheduleItem(item) {
    return { status: item.status, start: item.start, end: item.end };
  }

  function sanitizeGraphResponse(raw) {
    return {
      value: (raw.value || []).map((schedule) => ({
        scheduleId: schedule.scheduleId,
        scheduleItems: (schedule.scheduleItems || []).map(sanitizeScheduleItem),
      })),
    };
  }

  async function fetchFreeBusy(accessToken, email) {
    setStatus("Haetaan vapaa/varattu-tietoja Graph-rajapinnasta…");

    const start = new Date();
    start.setHours(8, 0, 0, 0);
    const end = new Date();
    end.setHours(17, 0, 0, 0);

    try {
      const res = await fetch("https://graph.microsoft.com/v1.0/me/calendar/getSchedule", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + accessToken,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          schedules: [email],
          startTime: { dateTime: start.toISOString(), timeZone: "UTC" },
          endTime: { dateTime: end.toISOString(), timeZone: "UTC" },
          availabilityViewInterval: 30,
        }),
      });

      if (!res.ok) {
        const errBody = await res.text();
        throw new Error("Graph API vastasi virheellä (" + res.status + "): " + errBody);
      }

      const data = await res.json();

      // Debug: näytetään täysin raaka, suodattamaton vastaus omana
      // lohkonaan. Tämä EI vaikuta yllä olevaan varsinaiseen näkymään,
      // joka käyttää edelleen sanitize-funktiota — tämä on pelkkä
      // rinnakkainen ikkuna siihen mitä Graph oikeasti lähettää.
      const debugEl = document.getElementById("debugRaw");
      if (debugEl) debugEl.textContent = JSON.stringify(data, null, 2);

      const clean = sanitizeGraphResponse(data);
      renderResults(clean);
      setStatus("Valmis — tiedot haettu suoraan omasta kalenteristasi tälle päivälle klo 8–17.");
    } catch (err) {
      console.error(err);
      setStatus("Kalenterin haku epäonnistui: " + err.message, true);
    }
  }

  function renderResults(data) {
    resultsEl.innerHTML = "";
    const schedule = data.value && data.value[0];
    if (!schedule || !schedule.scheduleItems || schedule.scheduleItems.length === 0) {
      resultsEl.innerHTML = '<div class="card">Ei varauksia tälle päivälle klo 8–17 — koko päivä vapaana.</div>';
      return;
    }
    schedule.scheduleItems.forEach((item) => {
      const div = document.createElement("div");
      div.className = "card";
      // Korjattu: väritys riippuu nyt oikeasti statuksesta, ei ole enää
      // aina "status-busy" riippumatta todellisesta tilasta.
      const statusClass = item.status === "free" ? "status-free" : "status-busy";
      const startTime = new Date(item.start.dateTime + "Z").toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" });
      const endTime = new Date(item.end.dateTime + "Z").toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" });
      div.innerHTML =
        '<span class="' + statusClass + '">' + item.status + "</span> &middot; " + startTime + "–" + endTime;
      resultsEl.appendChild(div);
    });
  }
</script>

</body>
</html>
